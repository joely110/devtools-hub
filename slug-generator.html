<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Generate URL-friendly slugs from any text. Perfect for blog posts, pages, and SEO. Free and instant.">
    <meta name="keywords" content="slug generator, url slug, seo slug, create slug, friendly url">
    <title>Slug Generator - DevTools Hub</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div class="header-content">
            <a href="index.html" class="logo"><div class="logo-icon">{ }</div><span class="logo-text">DevTools Hub</span></a>
            <div class="header-right">
                <nav class="nav-links"><a href="index.html">Tools</a><a href="index.html#about">About</a></nav>
                <div class="theme-switcher">
                    <button class="theme-btn" data-theme="light" title="Light" onclick="setTheme('light')">☀</button>
                    <button class="theme-btn" data-theme="dark" title="Dark" onclick="setTheme('dark')">🌙</button>
                    <button class="theme-btn" data-theme="sepia" title="Sepia" onclick="setTheme('sepia')">📜</button>
                    <button class="theme-btn" data-theme="contrast" title="High Contrast" onclick="setTheme('contrast')">◐</button>
                </div>
            </div>
        </div>
    </header>
    <main>
        <a href="index.html" class="back-link">← Back to all tools</a>
        <div class="tool-header"><h1>Slug Generator</h1><p>Create URL-friendly slugs from any text</p></div>

        <div class="card">
            <div class="card-title">Enter Text</div>
            <textarea id="input-text" placeholder="Enter your title here... (e.g., The Ultimate Guide to Building REST APIs)" style="height:100px;"></textarea>
            <div class="btn-group">
                <button class="btn btn-primary" onclick="generateSlug()">Generate Slug</button>
                <button class="btn btn-secondary" onclick="clearSlug()">Clear</button>
            </div>
        </div>

        <div class="card" id="result-card" style="display:none;">
            <div class="card-title">Generated Slug</div>
            <div id="slug-output" style="font-family:'SF Mono',Monaco,monospace;font-size:1.2rem;padding:1rem;background:var(--bg);border:1px solid var(--border);border-radius:8px;word-break:break-all;"></div>
            <div class="btn-group">
                <button class="btn btn-primary" onclick="copySlug()">Copy Slug</button>
                <button class="btn btn-secondary" onclick="copyURL()">Copy as Full URL</button>
            </div>
        </div>

        <div class="card">
            <div class="card-title">Options</div>
            <div style="display:flex;flex-direction:column;gap:0.75rem;margin-top:1rem;">
                <label style="display:flex;align-items:center;gap:0.75rem;"><input type="checkbox" id="opt-lowercase" checked> Convert to lowercase</label>
                <label style="display:flex;align-items:center;gap:0.75rem;"><input type="checkbox" id="opt-trim" checked> Trim extra whitespace</label>
                <label style="display:flex;align-items:center;gap:0.75rem;"><input type="checkbox" id="opt-special" checked> Remove special characters</label>
                <label style="display:flex;align-items:center;gap:0.75rem;"><input type="checkbox" id="opt-single" checked> Collapse multiple dashes to one</label>
            </div>
        </div>

        <div class="card">
            <div class="card-title">Example Slugs</div>
            <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:0.75rem;margin-top:1rem;">
                <button class="preset-btn" onclick="setExample('How to Learn Python in 30 Days')"><strong>How to Learn Python in 30 Days</strong><code>how-to-learn-python-in-30-days</code></button>
                <button class="preset-btn" onclick="setExample('The Best Coffee Shops in Brooklyn, NYC!')"><strong>The Best Coffee Shops in Brooklyn, NYC!</strong><code>the-best-coffee-shops-in-brooklyn-nyc</code></button>
                <button class="preset-btn" onclick="setExample('10 Tips for Remote Work Success')"><strong>10 Tips for Remote Work Success</strong><code>10-tips-for-remote-work-success</code></button>
                <button class="preset-btn" onclick="setExample('What Is the MERN Stack? (2024 Guide)')"><strong>What Is the MERN Stack? (2024 Guide)</strong><code>what-is-the-mern-stack-2024-guide</code></button>
            </div>
        </div>
    </main>
    <footer><p>&copy; 2026 DevTools Hub. All tools are free to use.</p></footer>
    <script>
        function setTheme(theme) { document.body.setAttribute('data-theme', theme); document.querySelectorAll('.theme-btn').forEach(btn => btn.classList.toggle('active', btn.getAttribute('data-theme') === theme)); localStorage.setItem('theme', theme); }
        setTheme(localStorage.getItem('theme') || 'light');

        function generateSlug() {
            let text = document.getElementById('input-text').value;
            if (!text.trim()) { alert('Please enter some text first.'); return; }

            if (document.getElementById('opt-trim').checked) text = text.trim().replace(/\s+/g, ' ');
            if (document.getElementById('opt-special').checked) text = text.replace(/[^a-zA-Z0-9\s-]/g, '');
            if (document.getElementById('opt-lowercase').checked) text = text.toLowerCase();
            text = text.replace(/\s+/g, '-');
            if (document.getElementById('opt-single').checked) text = text.replace(/-+/g, '-');
            text = text.replace(/^-+|-+$/g, '');

            document.getElementById('slug-output').textContent = text;
            document.getElementById('result-card').style.display = 'block';
            window.currentSlug = text;
        }

        function setExample(text) { document.getElementById('input-text').value = text; generateSlug(); }
        function clearSlug() { document.getElementById('input-text').value = ''; document.getElementById('result-card').style.display = 'none'; }
        function copySlug() { if (window.currentSlug) navigator.clipboard.writeText(window.currentSlug).then(() => alert('Slug copied!')); }
        function copyURL() { if (window.currentSlug) navigator.clipboard.writeText('https://example.com/' + window.currentSlug).then(() => alert('URL copied!')); }
    </script>
</body>
</html>
