</head>
<body>

    <main>
        <a href="index.html" class="back-link">← Back to all tools</a>
        <div class="tool-header"><h1>QR Code Generator</h1><p>Generate QR codes for text, URLs, WiFi, and more</p></div>

        <div class="card">
            <div class="card-title">Content</div>
            <textarea id="qr-input" placeholder="Enter URL or text here..." style="height:80px;"></textarea>
            <div class="btn-group">
                <button class="btn btn-primary" onclick="generateQR()">Generate QR Code</button>
            </div>
        </div>

        <div class="card" id="result-card" style="display:none;">
            <div class="card-title">QR Code</div>
            <div id="qr-result" style="text-align:center;padding:1rem;"></div>
            <div class="btn-group" style="justify-content:center;">
                <button class="btn btn-primary" onclick="downloadQR()">Download PNG</button>
            </div>
        </div>
    </main>
    <footer><p>&copy; 2026 DevTools Hub. All tools are free to use.</p></footer>
    <script>
    function setTheme(theme) { document.body.setAttribute('data-theme', theme); document.querySelectorAll('.theme-btn').forEach(btn => btn.classList.toggle('active', btn.getAttribute('data-theme') === theme)); localStorage.setItem('theme', theme); }
    setTheme(localStorage.getItem('theme') || 'light');

    // QR Code Generator - Standalone implementation
    var QRCode = (function() {
        'use strict';

        var EC_LEVELS = { L: 1, M: 0, Q: 3, H: 2 };

        // QR Code encoding tables
        var MODE = { NUMERIC: 1, ALPHANUMERIC: 2, BYTE: 4, KANJI: 8 };
        var CAPACITY_VERSION1 = [19, 34, 55, 80, 108, 136, 156, 194, 232];

        // Error correction lookup (version 1-9 M level)
        var EC_TABLE = {
            1: 10, 2: 16, 3: 26, 4: 18, 5: 24, 6: 16, 7: 18, 8: 22, 9: 20
        };

        // Galois Field
        var GF = {
            exp: new Uint8Array(512),
            log: new Uint8Array(256)
        };
        (function() {
            var x = 1;
            for (var i = 0; i < 255; i++) {
                GF.exp[i] = x;
                GF.log[x] = i;
                x = (x << 1) ^ (x & 128 ? 0x11d : 0);
            }
            for (var i = 255; i < 512; i++) GF.exp[i] = GF.exp[i - 255];
        })();

        function gfMul(a, b) {
            if (a === 0 || b === 0) return 0;
            return GF.exp[GF.log[a] + GF.log[b]];
        }

        function rsGeneratorPoly(degree) {
            var poly = [1];
            for (var i = 0; i < degree; i++) {
                poly.push(0);
                for (var j = 0; j < poly.length; j++) {
                    poly[j] = GF.mul ? GF.mul(poly[j], 2) : gfMul(poly[j], 2);
                    if (j + 1 < poly.length) poly[j] ^= poly[j + 1];
                }
            }
            return poly;
        }

        function rsEncode(data, ecLen) {
            var gen = rsGeneratorPoly(ecLen);
            var msg = data.slice();
            for (var i = 0; i < ecLen; i++) msg.push(0);
            for (var i = 0; i < data.length; i++) {
                var coef = msg[i];
                if (coef !== 0) {
                    for (var j = 0; j < gen.length; j++) {
                        msg[i + j] ^= gfMul(gen[j], coef);
                    }
                }
            }
            return msg.slice(data.length);
        }

        function encodeByte(text) {
            var bits = [];
            // Mode indicator (0100 = byte mode)
            bits.push(0, 1, 0, 0);
            // Character count (8 bits for version 1-9)
            var len = text.length;
            for (var i = 7; i >= 0; i--) bits.push((len >> i) & 1);
            // Data
            for (var i = 0; i < text.length; i++) {
                var code = text.charCodeAt(i);
                for (var j = 7; j >= 0; j--) bits.push((code >> j) & 1);
            }
            return bits;
        }

        function createMatrix(text) {
            var size = 21; // Version 1
            var m = [];
            for (var i = 0; i < size; i++) {
                m[i] = new Array(size).fill(-1);
            }

            // Finder patterns
            function addFinder(row, col) {
                for (var r = 0; r < 7; r++) {
                    for (var c = 0; c < 7; c++) {
                        if (r === 0 || r === 6 || c === 0 || c === 6 ||
                            (r >= 2 && r <= 4 && c >= 2 && c <= 4)) {
                            m[row + r][col + c] = 1;
                        } else {
                            m[row + r][col + c] = 0;
                        }
                    }
                }
            }
            addFinder(0, 0);
            addFinder(0, size - 7);
            addFinder(size - 7, 0);

            // Separators
            for (var i = 0; i < 8; i++) {
                if (m[7][i] === -1) m[7][i] = 0;
                if (m[i][7] === -1) m[i][7] = 0;
                if (m[7][size - 1 - i] === -1) m[7][size - 1 - i] = 0;
                if (m[size - 1 - i][7] === -1) m[size - 1 - i][7] = 0;
                if (m[i][size - 8] === -1) m[i][size - 8] = 0;
                if (m[size - 8][i] === -1) m[size - 8][i] = 0;
            }

            // Timing patterns
            for (var i = 8; i < size - 8; i++) {
                if (m[6][i] === -1) m[6][i] = i % 2 === 0 ? 1 : 0;
                if (m[i][6] === -1) m[i][6] = i % 2 === 0 ? 1 : 0;
            }

            // Alignment pattern (center)
            var c = 10;
            for (var r = c - 2; r <= c + 2; r++) {
                for (var cc = c - 2; cc <= c + 2; cc++) {
                    if (Math.abs(r - c) === 2 || Math.abs(cc - c) === 2) {
                        m[r][cc] = 1;
                    } else if (Math.abs(r - c) <= 1 && Math.abs(cc - c) <= 1) {
                        m[r][cc] = 1;
                    } else if (m[r][cc] === -1) {
                        m[r][cc] = 0;
                    }
                }
            }

            // Format info (M level, mask 0)
            // 01010 (M) + 000 (mask 0) = 01010000 -> bits: 0,1,0,1,0,0,0,0
            // Then XOR with mask pattern
            var format = [0, 1, 0, 1, 0, 0, 0, 0];
            var formatBits = [];
            for (var i = 0; i < 6; i++) formatBits.push(format[i]);
            formatBits.push(0, 0); // split
            for (var i = 6; i < 8; i++) formatBits.push(format[i]);

            // Place format info
            for (var i = 0; i < 6; i++) m[8][i] = formatBits[i];
            m[8][6] = formatBits[6];
            m[8][7] = formatBits[7];
            m[8][8] = formatBits[8];
            m[7][8] = formatBits[9];
            for (var i = 0; i < 5; i++) m[5 - i][8] = formatBits[10 + i];
            for (var i = 0; i < 6; i++) m[8][size - 1 - i] = formatBits[i];
            m[8][size - 7] = formatBits[6];
            m[8][size - 8] = formatBits[7];
            for (var i = 0; i < 6; i++) m[size - 1 - i][8] = formatBits[i];
            m[size - 7][8] = formatBits[6];
            m[size - 8][8] = formatBits[7];

            // Data encoding
            var bits = encodeByte(text);

            // Terminator and padding
            var maxBits = 104; // version 1 M level data capacity
            for (var i = 0; i < 4 && bits.length < maxBits; i++) bits.push(0);
            while (bits.length % 8 !== 0) bits.push(0);
            var pads = [236, 17];
            var idx = 0;
            while (bits.length < maxBits) {
                var pad = pads[idx % 2];
                for (var i = 7; i >= 0; i--) {
                    bits.push((pad >> i) & 1);
                }
                idx++;
            }

            // Reed-Solomon error correction
            var ecLen = EC_TABLE[1];
            var ecBits = rsEncode(bits, ecLen);
            bits = bits.concat(ecBits);

            // Place data
            var bitIdx = 0;
            var upward = true;
            for (var col = size - 1; col > 0; col -= 2) {
                if (col === 6) col = 5;
                for (var row = upward ? size - 1 : 0; upward ? row >= 0 : row < size; row += upward ? -1 : 1) {
                    for (var i = 0; i < 2; i++) {
                        var cc = col - i;
                        if (m[row][cc] === -1) {
                            m[row][cc] = bitIdx < bits.length ? bits[bitIdx++] : 0;
                        }
                    }
                }
                upward = !upward;
            }

            // Apply mask 0 (flip all data modules)
            for (var row = 0; row < size; row++) {
                for (var col = 0; col < size; col++) {
                    if ((row < 9 && col < 9) || (row < 9 && col >= size - 8) || (row >= size - 8 && col < 9)) continue;
                    if (row === 6 || col === 6) continue;
                    if (m[row][col] === 0 || m[row][col] === 1) {
                        m[row][col] ^= 1;
                    }
                }
            }

            // Dark module
            m[size - 8][8] = 1;

            return m;
        }

        function toCanvas(canvas, text, opts) {
            var size = (opts && opts.width) || 256;
            var margin = (opts && opts.margin) || 4;
            var dark = ((opts && opts.color) && opts.color.dark) || '#000000';
            var light = ((opts && opts.color) && opts.color.light) || '#ffffff';

            var matrix = createMatrix(text);
            var matrixSize = matrix.length;
            var cellSize = Math.floor((size - margin * 2) / matrixSize);
            var actualSize = cellSize * matrixSize + margin * 2;

            canvas.width = actualSize;
            canvas.height = actualSize;
            var ctx = canvas.getContext('2d');

            ctx.fillStyle = light;
            ctx.fillRect(0, 0, actualSize, actualSize);

            ctx.fillStyle = dark;
            for (var row = 0; row < matrixSize; row++) {
                for (var col = 0; col < matrixSize; col++) {
                    if (matrix[row][col] === 1) {
                        var x = margin + col * cellSize;
                        var y = margin + row * cellSize;
                        ctx.fillRect(x, y, cellSize, cellSize);
                    }
                }
            }
        }

        return { toCanvas: toCanvas };
    })();

    function generateQR() {
        var input = document.getElementById('qr-input').value;
        if (!input.trim()) {
            alert('Please enter content first.');
            return;
        }

        var container = document.getElementById('qr-result');
        container.innerHTML = '';

        var canvas = document.createElement('canvas');
        canvas.width = 256;
        canvas.height = 256;

        try {
            QRCode.toCanvas(canvas, input, {
                width: 256,
                margin: 2,
                color: {
                    dark: '#000000',
                    light: '#ffffff'
                }
            });
            container.appendChild(canvas);
            document.getElementById('result-card').style.display = 'block';
        } catch (e) {
            alert('Error generating QR code: ' + e.message);
        }
    }

    function downloadQR() {
        var canvas = document.querySelector('#qr-result canvas');
        if (canvas) {
            var url = canvas.toDataURL('image/png');
            var a = document.createElement('a');
            a.href = url;
            a.download = 'qrcode.png';
            a.click();
        }
    }
    </script>
