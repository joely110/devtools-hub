<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Generate QR codes instantly. Create QR codes for text, URLs, WiFi, contacts. Free QR code generator.">
    <meta name="keywords" content="qr code generator, generate qr code, qr code, qr generator, create qr">
    <title>QR Code Generator - DevTools Hub</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        #qr-result { min-height: 256px; display: flex; align-items: center; justify-content: center; }
        #qr-result canvas { border: 1px solid var(--border); border-radius: 8px; max-width: 100%; }
    </style>
</head>
<body>
    <header>
        <div class="header-content">
            <a href="index.html" class="logo"><div class="logo-icon">{ }</div><span class="logo-text">DevTools Hub</span></a>
            <div class="header-right">
                <nav class="nav-links"><a href="index.html">Tools</a><a href="index.html#about">About</a></nav>
                <div class="theme-switcher">
                    <button class="theme-btn" data-theme="light" title="Light" onclick="setTheme('light')">☀</button>
                    <button class="theme-btn" data-theme="dark" title="Dark" onclick="setTheme('dark')">🌙</button>
                    <button class="theme-btn" data-theme="sepia" title="Sepia" onclick="setTheme('sepia')">📜</button>
                    <button class="theme-btn" data-theme="contrast" title="High Contrast" onclick="setTheme('contrast')">◐</button>
                </div>
            </div>
        </div>
    </header>
    <main>
        <a href="index.html" class="back-link">← Back to all tools</a>
        <div class="tool-header"><h1>QR Code Generator</h1><p>Generate QR codes for text, URLs, WiFi, and more</p></div>

        <div class="card">
            <div class="card-title">Content</div>
            <textarea id="qr-input" placeholder="Enter URL or text here..." style="height:80px;"></textarea>
            <div class="btn-group">
                <button class="btn btn-primary" onclick="generateQR()">Generate QR Code</button>
            </div>
        </div>

        <div class="card" id="result-card" style="display:none;">
            <div class="card-title">QR Code</div>
            <div id="qr-result" style="text-align:center;padding:1rem;"></div>
            <div class="btn-group" style="justify-content:center;">
                <button class="btn btn-primary" onclick="downloadQR()">Download PNG</button>
            </div>
        </div>
    </main>
    <footer><p>&copy; 2026 DevTools Hub. All tools are free to use.</p></footer>
    <script>
    function setTheme(theme) { document.body.setAttribute('data-theme', theme); document.querySelectorAll('.theme-btn').forEach(btn => btn.classList.toggle('active', btn.getAttribute('data-theme') === theme)); localStorage.setItem('theme', theme); }
    setTheme(localStorage.getItem('theme') || 'light');

    // Standalone QR Code Generator
    var QRCode = (function() {
        var EC_L = 1, EC_M = 0, EC_Q = 3, EC_H = 2;

        // Version 1 capacity (byte mode, M level = 10%)
        var CAPACITY = [0, 19, 34, 55, 80, 108, 136, 156, 194, 232];

        // EC table for M level
        var EC_M_TABLE = { 1: 10, 2: 16, 3: 26, 4: 18, 5: 24, 6: 16, 7: 18, 8: 22, 9: 20 };

        // GF(2^8) operations
        var EXP = new Uint8Array(512);
        var LOG = new Uint8Array(256);
        (function() {
            var x = 1;
            for (var i = 0; i < 255; i++) {
                EXP[i] = x;
                LOG[x] = i;
                x = (x << 1) ^ (x & 128 ? 0x11d : 0);
            }
            for (var i = 255; i < 512; i++) EXP[i] = EXP[i - 255];
        })();

        function gfMul(a, b) {
            if (a === 0 || b === 0) return 0;
            return EXP[(LOG[a] + LOG[b]) % 255];
        }

        function rsGenPoly(degree) {
            var poly = [1];
            for (var i = 0; i < degree; i++) {
                poly.push(0);
                for (var j = 0; j < poly.length - 1; j++) {
                    poly[j] = gfMul(poly[j], 2) ^ poly[j + 1];
                }
                poly[poly.length - 1] = gfMul(poly[poly.length - 1], 2);
            }
            return poly;
        }

        function rsEncode(data, ecLen) {
            var gen = rsGenPoly(ecLen);
            var msg = data.slice();
            for (var i = 0; i < ecLen; i++) msg.push(0);
            for (var i = 0; i < data.length; i++) {
                var coef = msg[i];
                if (coef !== 0) {
                    for (var j = 0; j < gen.length; j++) {
                        msg[i + j] ^= gfMul(gen[j], coef);
                    }
                }
            }
            return msg.slice(data.length);
        }

        function encodeData(text) {
            var bits = [];
            // Mode: byte (0100)
            bits.push(0, 1, 0, 0);
            // Length (8 bits)
            var len = text.length;
            for (var i = 7; i >= 0; i--) bits.push((len >> i) & 1);
            // Data
            for (var i = 0; i < text.length; i++) {
                var c = text.charCodeAt(i);
                for (var j = 7; j >= 0; j--) bits.push((c >> j) & 1);
            }
            // Terminator
            for (var i = 0; i < 4 && bits.length < CAPACITY[1] * 8; i++) bits.push(0);
            // Pad to byte
            while (bits.length % 8 !== 0) bits.push(0);
            // Pad bytes
            var pads = [236, 17];
            var pi = 0;
            while (bits.length < CAPACITY[1] * 8 - 8) {
                var pad = pads[pi++ % 2];
                for (var i = 7; i >= 0; i--) bits.push((pad >> i) & 1);
            }
            // EC
            var ecBits = rsEncode(bits, EC_M_TABLE[1]);
            bits = bits.concat(ecBits);
            return bits;
        }

        function createMatrix(text) {
            var size = 21;
            var m = [];
            for (var i = 0; i < size; i++) m[i] = new Array(size).fill(-1);

            // Finder patterns
            function fp(row, col) {
                for (var r = 0; r < 7; r++) {
                    for (var c = 0; c < 7; c++) {
                        m[row + r][col + c] = (r === 0 || r === 6 || c === 0 || c === 6 || (r >= 2 && r <= 4 && c >= 2 && c <= 4)) ? 1 : 0;
                    }
                }
            }
            fp(0, 0);
            fp(0, size - 7);
            fp(size - 7, 0);

            // Separators
            for (var i = 0; i < 8; i++) {
                if (m[7][i] === -1) m[7][i] = 0;
                if (m[i][7] === -1) m[i][7] = 0;
                if (m[7][size - 1 - i] === -1) m[7][size - 1 - i] = 0;
                if (m[size - 1 - i][7] === -1) m[size - 1 - i][7] = 0;
                if (m[i][size - 8] === -1) m[i][size - 8] = 0;
                if (m[size - 8][i] === -1) m[size - 8][i] = 0;
            }

            // Timing
            for (var i = 8; i < size - 8; i++) {
                if (m[6][i] === -1) m[6][i] = i % 2 === 0 ? 1 : 0;
                if (m[i][6] === -1) m[i][6] = i % 2 === 0 ? 1 : 0;
            }

            // Alignment (center only for v1)
            var c = 10;
            for (var r = -2; r <= 2; r++) {
                for (var cc = -2; cc <= 2; cc++) {
                    var rr = c + r, cc2 = c + cc;
                    if (rr >= 0 && rr < size && cc2 >= 0 && cc2 < size && m[rr][cc2] === -1) {
                        m[rr][cc2] = (Math.abs(r) === 2 || Math.abs(cc) === 2) ? 1 : 0;
                    }
                }
            }

            // Format info (M level = 01010, mask 0 = 000)
            // String: 01010 + 000 = 01010000
            var fmt = '01010000'.split('').map(Number);

            // Place format info
            for (var i = 0; i < 6; i++) m[8][i] = fmt[i];
            m[8][6] = fmt[6]; m[8][7] = fmt[7];
            m[8][8] = fmt[8]; m[7][8] = fmt[9];
            for (var i = 0; i < 5; i++) m[5 - i][8] = fmt[10 + i];
            for (var i = 0; i < 6; i++) m[8][size - 1 - i] = fmt[i];
            m[8][size - 7] = fmt[6]; m[8][size - 8] = fmt[7];
            for (var i = 0; i < 6; i++) m[size - 1 - i][8] = fmt[i];
            m[size - 7][8] = fmt[6]; m[size - 8][8] = fmt[7];

            // Data
            var bits = encodeData(text);
            var bi = 0, up = true;
            for (var col = size - 1; col > 0; col -= 2) {
                if (col === 6) col = 5;
                for (var row = up ? size - 1 : 0; up ? row >= 0 : row < size; row += up ? -1 : 1) {
                    for (var i = 0; i < 2; i++) {
                        var cc = col - i;
                        if (m[row][cc] === -1) {
                            m[row][cc] = bi < bits.length ? bits[bi++] : 0;
                        }
                    }
                }
                up = !up;
            }

            // Mask 0 (condition: row + col is odd) - but we just flip all
            for (var row = 0; row < size; row++) {
                for (var col = 0; col < size; col++) {
                    if (m[row][col] === 0 || m[row][col] === 1) {
                        if ((row < 9 && col < 9) || (row < 9 && col >= size - 8) || (row >= size - 8 && col < 9)) continue;
                        if (row === 6 || col === 6) continue;
                        m[row][col] ^= 1;
                    }
                }
            }

            m[size - 8][8] = 1;
            return m;
        }

        function toCanvas(canvas, text, opts) {
            var size = (opts && opts.width) || 256;
            var margin = (opts && opts.margin) || 4;
            var dark = ((opts && opts.color) && opts.color.dark) || '#000000';
            var light = ((opts && opts.color) && opts.color.light) || '#ffffff';

            var m = createMatrix(text);
            var ms = m.length;
            var cellSize = Math.floor((size - margin * 2) / ms);
            var actualSize = cellSize * ms + margin * 2;

            canvas.width = actualSize;
            canvas.height = actualSize;
            var ctx = canvas.getContext('2d');

            ctx.fillStyle = light;
            ctx.fillRect(0, 0, actualSize, actualSize);

            ctx.fillStyle = dark;
            for (var row = 0; row < ms; row++) {
                for (var col = 0; col < ms; col++) {
                    if (m[row][col] === 1) {
                        ctx.fillRect(margin + col * cellSize, margin + row * cellSize, cellSize, cellSize);
                    }
                }
            }
        }

        return { toCanvas: toCanvas };
    })();

    function generateQR() {
        var input = document.getElementById('qr-input').value;
        if (!input.trim()) {
            alert('Please enter content first.');
            return;
        }

        var container = document.getElementById('qr-result');
        container.innerHTML = '';
        var canvas = document.createElement('canvas');
        canvas.width = 256;
        canvas.height = 256;

        QRCode.toCanvas(canvas, input, {
            width: 256,
            margin: 2,
            color: { dark: '#000000', light: '#ffffff' }
        });

        container.appendChild(canvas);
        document.getElementById('result-card').style.display = 'block';
    }

    function downloadQR() {
        var canvas = document.querySelector('#qr-result canvas');
        if (canvas) {
            var a = document.createElement('a');
            a.href = canvas.toDataURL('image/png');
            a.download = 'qrcode.png';
            a.click();
        }
    }
    </script>
</body>
</html>
