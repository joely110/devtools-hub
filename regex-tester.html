<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Test and debug regular expressions online with real-time matching. Supports JavaScript regex syntax with syntax highlighting.">
    <meta name="keywords" content="regex tester, regular expression tester, regex debugger, online regex, test regex">
    <title>Regex Tester - Free Online Regular Expression Tool</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .tool-container {
            background: #fff;
            border-radius: 8px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        textarea, input[type="text"] {
            width: 100%;
            padding: 1rem;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
            font-size: 14px;
        }
        textarea:focus, input[type="text"]:focus {
            outline: none;
            border-color: #4a90d9;
        }
        input[type="text"] {
            margin-bottom: 1rem;
        }
        .flags {
            display: flex;
            gap: 1rem;
            margin: 1rem 0;
            flex-wrap: wrap;
        }
        .flag-label {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            cursor: pointer;
        }
        .matches {
            margin-top: 1rem;
            padding: 1rem;
            background: #f7fafc;
            border-radius: 6px;
            max-height: 300px;
            overflow-y: auto;
        }
        .match-item {
            padding: 0.5rem;
            border-bottom: 1px solid #e2e8f0;
            font-family: monospace;
        }
        .match-item:last-child {
            border-bottom: none;
        }
        .match-highlight {
            background: #fef3c7;
            padding: 0 2px;
        }
        .nav-links { margin-bottom: 1.5rem; }
        .nav-links a { color: #4a90d9; text-decoration: none; }
        .nav-links a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <header>
        <h1>Regex Tester</h1>
        <p>Test Regular Expressions in Real-Time</p>
    </header>

    <main>
        <div class="nav-links">
            <a href="index.html">&larr; Back to DevTools Hub</a>
        </div>

        <div class="tool-container">
            <label><strong>Regular Expression:</strong></label>
            <input type="text" id="regex-pattern" placeholder="Enter regex pattern (e.g., \d+-\d+-\d+)">
            <div class="flags">
                <label class="flag-label"><input type="checkbox" id="flag-g" checked> Global (g)</label>
                <label class="flag-label"><input type="checkbox" id="flag-i"> Case Insensitive (i)</label>
                <label class="flag-label"><input type="checkbox" id="flag-m"> Multiline (m)</label>
            </div>
        </div>

        <div class="tool-container">
            <label><strong>Test String:</strong></label>
            <textarea id="test-string" rows="6" placeholder="Enter text to test against the regex..."></textarea>
            <div style="margin-top: 1rem;">
                <button class="btn btn-primary" onclick="testRegex()">Test Regex</button>
                <button class="btn btn-secondary" onclick="clearRegex()">Clear</button>
            </div>
        </div>

        <div class="tool-container">
            <label><strong>Matches:</strong></label>
            <div id="matches" class="matches">Enter a pattern and test string, then click "Test Regex" to see matches.</div>
        </div>
    </main>

    <footer>
        <p>&copy; 2025 DevTools Hub. All tools are free to use.</p>
    </footer>

    <script>
        function testRegex() {
            const pattern = document.getElementById('regex-pattern').value;
            const testString = document.getElementById('test-string').value;
            const matchesDiv = document.getElementById('matches');

            if (!pattern || !testString) {
                matchesDiv.innerHTML = 'Please enter both a pattern and test string.';
                return;
            }

            let flags = '';
            if (document.getElementById('flag-g').checked) flags += 'g';
            if (document.getElementById('flag-i').checked) flags += 'i';
            if (document.getElementById('flag-m').checked) flags += 'm';

            try {
                const regex = new RegExp(pattern, flags);
                const matches = testString.match(regex);

                if (matches) {
                    let html = `<strong>${matches.length} match(es) found:</strong><br><br>`;
                    matches.forEach((match, i) => {
                        html += `<div class="match-item">Match ${i + 1}: <strong>${escapeHtml(match)}</strong> (index: ${testString.indexOf(match)})</div>`;
                    });
                    matchesDiv.innerHTML = html;
                } else {
                    matchesDiv.innerHTML = 'No matches found.';
                }
            } catch (e) {
                matchesDiv.innerHTML = `<span style="color: #e53e3e;">Invalid regex: ${escapeHtml(e.message)}</span>`;
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function clearRegex() {
            document.getElementById('regex-pattern').value = '';
            document.getElementById('test-string').value = '';
            document.getElementById('matches').innerHTML = 'Enter a pattern and test string, then click "Test Regex" to see matches.';
        }
    </script>
</body>
</html>
