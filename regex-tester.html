<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Test and debug regular expressions in real-time. Supports JavaScript regex with global, case-insensitive, and multiline flags.">
    <meta name="keywords" content="regex tester, regular expression tester, regex debugger">
    <title>Regex Tester - DevTools Hub</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div class="header-content">
            <a href="index.html" class="logo">
                <div class="logo-icon">{ }</div>
                <span class="logo-text">DevTools Hub</span>
            </a>
            <div class="header-right">
                <nav class="nav-links">
                    <a href="index.html">Tools</a>
                    <a href="index.html#about">About</a>
                </nav>
                <div class="theme-switcher">
                    <button class="theme-btn" data-theme="light" title="Light" onclick="setTheme('light')">☀</button>
                    <button class="theme-btn" data-theme="dark" title="Dark" onclick="setTheme('dark')">🌙</button>
                    <button class="theme-btn" data-theme="sepia" title="Sepia" onclick="setTheme('sepia')">📜</button>
                    <button class="theme-btn" data-theme="contrast" title="High Contrast" onclick="setTheme('contrast')">◐</button>
                </div>
            </div>
        </div>
    </header>

    <main>
        <a href="index.html" class="back-link">← Back to all tools</a>

        <div class="tool-header">
            <h1>Regex Tester</h1>
            <p>Test regular expressions in real-time with instant match highlighting</p>
        </div>

        <div class="card">
            <div class="card-title">Pattern</div>
            <input type="text" id="regex-pattern" placeholder="e.g., \d+-\d+-\d+ or [a-z]+">
            <div class="card-title" style="margin-top:1rem;">Flags</div>
            <div class="flags-group" style="display:flex;gap:1rem;flex-wrap:wrap;margin-bottom:1rem;">
                <label class="flag-label"><input type="checkbox" id="flag-g" checked> Global (g)</label>
                <label class="flag-label"><input type="checkbox" id="flag-i"> Case Insensitive (i)</label>
                <label class="flag-label"><input type="checkbox" id="flag-m"> Multiline (m)</label>
            </div>
        </div>

        <div class="card">
            <div class="card-title">Test String</div>
            <textarea id="test-string" rows="6" placeholder="Enter text to test against the pattern..."></textarea>
            <div class="btn-group">
                <button class="btn btn-primary" onclick="testRegex()">Test Regex</button>
                <button class="btn btn-secondary" onclick="clearRegex()">Clear</button>
            </div>
        </div>

        <div class="card">
            <div class="card-title">Matches</div>
            <div id="matches" class="output-box">Enter a pattern and test string, then click "Test Regex" to see matches.</div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 DevTools Hub. All tools are free to use.</p>
    </footer>

    <script>
        function setTheme(theme) {
            document.body.setAttribute('data-theme', theme);
            document.querySelectorAll('.theme-btn').forEach(btn => {
                btn.classList.toggle('active', btn.getAttribute('data-theme') === theme);
            });
            localStorage.setItem('theme', theme);
        }
        const savedTheme = localStorage.getItem('theme') || 'light';
        setTheme(savedTheme);

        function testRegex() {
            const pattern = document.getElementById('regex-pattern').value;
            const testString = document.getElementById('test-string').value;
            const matchesDiv = document.getElementById('matches');
            if (!pattern || !testString) { matchesDiv.innerHTML = 'Please enter both a pattern and test string.'; return; }
            let flags = '';
            if (document.getElementById('flag-g').checked) flags += 'g';
            if (document.getElementById('flag-i').checked) flags += 'i';
            if (document.getElementById('flag-m').checked) flags += 'm';
            try {
                const regex = new RegExp(pattern, flags);
                const matches = testString.match(regex);
                if (matches && matches.length > 0) {
                    let html = `<strong>${matches.length} match(es) found:</strong><br><br>`;
                    matches.forEach((match, i) => {
                        const index = testString.indexOf(match);
                        html += `<div style="padding:0.5rem 0;border-bottom:1px solid var(--border);">Match ${i + 1}: <span class="match-highlight">${escapeHtml(match)}</span> (index: ${index})</div>`;
                    });
                    matchesDiv.innerHTML = html;
                } else { matchesDiv.innerHTML = 'No matches found.'; }
            } catch (e) { matchesDiv.innerHTML = `<span style="color:var(--error);">Invalid regex: ${escapeHtml(e.message)}</span>`; }
        }
        function escapeHtml(text) { const div = document.createElement('div'); div.textContent = text; return div.innerHTML; }
        function clearRegex() { document.getElementById('regex-pattern').value = ''; document.getElementById('test-string').value = ''; document.getElementById('matches').innerHTML = 'Enter a pattern and test string, then click "Test Regex" to see matches.'; }
    </script>
</body>
</html>
