<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Format, validate, and convert YAML to JSON online. Free instant YAML parser and formatter. No signup required.">
    <meta name="keywords" content="yaml formatter, yaml validator, yaml to json, yaml parser">
    <title>YAML Formatter - DevTools Hub</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .tool-header { margin-bottom: 2rem; }
        .tool-header h1 { font-size: 1.75rem; font-weight: 700; margin-bottom: 0.5rem; }
        .tool-header p { color: var(--text-muted); }
        .back-link { display: inline-flex; align-items: center; gap: 0.5rem; color: var(--primary); text-decoration: none; font-weight: 500; margin-bottom: 1.5rem; }
        .back-link:hover { text-decoration: underline; }
        .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.5rem; margin-bottom: 1rem; }
        .card-title { font-size: 0.875rem; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.75rem; }
        textarea { width: 100%; height: 200px; padding: 1rem; border: 1px solid var(--border); border-radius: 8px; font-family: 'SF Mono', Monaco, monospace; font-size: 0.9rem; resize: vertical; background: var(--bg); color: var(--text); }
        textarea:focus { outline: none; border-color: var(--primary); }
        .btn-group { display: flex; gap: 0.5rem; margin-top: 1rem; flex-wrap: wrap; }
        .output-box { margin-top: 1rem; padding: 1rem; border-radius: 8px; font-family: 'SF Mono', Monaco, monospace; font-size: 0.9rem; white-space: pre-wrap; word-break: break-all; max-height: 400px; overflow-y: auto; background: var(--bg); border: 1px solid var(--border); }
        .output-box.success { background: #f0fdf4; border-color: #86efac; }
        .output-box.error { background: #fef2f2; border-color: #fca5a5; }
    </style>
</head>
<body>
    <header>
        <div class="header-content">
            <a href="index.html" class="logo">
                <div class="logo-icon">{ }</div>
                <span class="logo-text">DevTools Hub</span>
            </a>
            <nav class="nav-links">
                <a href="index.html">Tools</a>
                <a href="index.html#about">About</a>
            </nav>
        </div>
    </header>

    <main>
        <a href="index.html" class="back-link">&larr; Back to all tools</a>

        <div class="tool-header">
            <h1>YAML Formatter</h1>
            <p>Format, validate, and convert YAML to JSON</p>
        </div>

        <div class="card">
            <div class="card-title">Input YAML</div>
            <textarea id="yaml-input" placeholder="name: John
age: 30
city: New York"></textarea>
            <div class="btn-group">
                <button class="btn btn-primary" onclick="formatYAML()">Format</button>
                <button class="btn btn-secondary" onclick="minifyYAML()">Minify</button>
                <button class="btn btn-secondary" onclick="validateYAML()">Validate</button>
                <button class="btn btn-secondary" onclick="yamlToJSON()">YAML → JSON</button>
                <button class="btn btn-secondary" onclick="clearYAML()">Clear</button>
            </div>
        </div>

        <div class="card" id="result-card" style="display: none;">
            <div class="card-title">Output</div>
            <div class="output-box" id="output"></div>
            <div class="btn-group">
                <button class="btn btn-primary" id="copy-btn" onclick="copyResult()">Copy</button>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 DevTools Hub. All tools are free to use.</p>
    </footer>

    <script>
        function parseYAML(yaml) {
            const lines = yaml.split('\n');
            const result = {};
            const stack = [{ obj: result, indent: -1 }];
            for (let line of lines) {
                if (line.trim() === '' || line.trim().startsWith('#')) continue;
                const indent = line.search(/\S/);
                while (stack.length > 1 && stack[stack.length - 1].indent >= indent) stack.pop();
                const parent = stack[stack.length - 1].obj;
                const trimmed = line.trim();
                if (trimmed.startsWith('- ')) {
                    const value = trimmed.substring(2).trim();
                    if (Array.isArray(parent)) {
                        if (value.includes(':')) {
                            const item = {};
                            const [key, ...rest] = value.split(':');
                            item[key.trim()] = rest.join(':').trim();
                            parent.push(item);
                        } else {
                            parent.push(value.replace(/['"]/g, ''));
                        }
                    }
                } else if (trimmed.includes(':')) {
                    const [key, ...rest] = trimmed.split(':');
                    const value = rest.join(':').trim();
                    const keyName = key.trim();
                    if (value === '' || value === '|' || value === '>') {
                        parent[keyName] = {};
                        stack.push({ obj: parent[keyName], indent: indent });
                    } else if (value.startsWith('[') && value.endsWith(']')) {
                        parent[keyName] = value.slice(1, -1).split(',').map(s => s.trim().replace(/['"]/g, ''));
                    } else {
                        parent[keyName] = value.replace(/['"]/g, '');
                    }
                }
            }
            return result;
        }

        function toYAML(obj, indent = 0) {
            let result = '';
            const spaces = '  '.repeat(indent);
            if (Array.isArray(obj)) {
                for (const item of obj) {
                    if (typeof item === 'object') {
                        result += `${spaces}- ${toYAML(item, indent + 1).trim()}\n`;
                    } else {
                        result += `${spaces}- ${item}\n`;
                    }
                }
            } else if (typeof obj === 'object' && obj !== null) {
                for (const [key, value] of Object.entries(obj)) {
                    if (typeof value === 'object' && value !== null) {
                        result += `${spaces}${key}:\n${toYAML(value, indent + 1)}`;
                    } else {
                        result += `${spaces}${key}: ${value}\n`;
                    }
                }
            } else {
                result += `${obj}\n`;
            }
            return result;
        }

        function formatYAML() {
            const input = document.getElementById('yaml-input').value;
            const resultCard = document.getElementById('result-card');
            const output = document.getElementById('output');
            if (!input.trim()) { showError('Please enter some YAML first.'); return; }
            try {
                const parsed = parseYAML(input);
                output.textContent = toYAML(parsed).trim();
                output.className = 'output-box success';
                resultCard.style.display = 'block';
            } catch (e) {
                showError('Invalid YAML: ' + e.message);
            }
        }

        function minifyYAML() {
            const input = document.getElementById('yaml-input').value;
            const resultCard = document.getElementById('result-card');
            const output = document.getElementById('output');
            if (!input.trim()) { showError('Please enter some YAML first.'); return; }
            try {
                const parsed = parseYAML(input);
                output.textContent = JSON.stringify(parsed);
                output.className = 'output-box';
                resultCard.style.display = 'block';
            } catch (e) {
                showError('Invalid YAML: ' + e.message);
            }
        }

        function validateYAML() {
            const input = document.getElementById('yaml-input').value;
            const resultCard = document.getElementById('result-card');
            const output = document.getElementById('output');
            if (!input.trim()) { showError('Please enter some YAML first.'); return; }
            try {
                parseYAML(input);
                output.textContent = '✓ Valid YAML';
                output.className = 'output-box success';
                resultCard.style.display = 'block';
            } catch (e) {
                showError('Invalid YAML: ' + e.message);
            }
        }

        function yamlToJSON() {
            const input = document.getElementById('yaml-input').value;
            const resultCard = document.getElementById('result-card');
            const output = document.getElementById('output');
            if (!input.trim()) { showError('Please enter some YAML first.'); return; }
            try {
                const parsed = parseYAML(input);
                output.textContent = JSON.stringify(parsed, null, 2);
                output.className = 'output-box';
                resultCard.style.display = 'block';
            } catch (e) {
                showError('Invalid YAML: ' + e.message);
            }
        }

        function showError(message) {
            const resultCard = document.getElementById('result-card');
            const output = document.getElementById('output');
            output.textContent = message;
            output.className = 'output-box error';
            resultCard.style.display = 'block';
        }

        function clearYAML() {
            document.getElementById('yaml-input').value = '';
            document.getElementById('result-card').style.display = 'none';
        }

        function copyResult() {
            navigator.clipboard.writeText(document.getElementById('output').textContent).then(() => alert('Copied!'));
        }
    </script>
</body>
</html>
