<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Free online Base64 encoder and decoder. Encode strings or decode Base64 data instantly in your browser.">
    <meta name="keywords" content="Base64 encoder, Base64 decoder, encode Base64, decode Base64, online Base64 tool">
    <title>Base64 Encoder/Decoder - Free Online Tool</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .tool-container {
            background: #fff;
            border-radius: 8px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        textarea {
            width: 100%;
            height: 150px;
            padding: 1rem;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-family: monospace;
            font-size: 14px;
            resize: vertical;
        }
        textarea:focus {
            outline: none;
            border-color: #4a90d9;
        }
        .result-box {
            margin-top: 1rem;
            padding: 1rem;
            background: #f7fafc;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            font-family: monospace;
            white-space: pre-wrap;
            word-break: break-all;
            max-height: 300px;
            overflow-y: auto;
        }
        .nav-links { margin-bottom: 1.5rem; }
        .nav-links a { color: #4a90d9; text-decoration: none; }
        .nav-links a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <header>
        <h1>Base64 Encoder/Decoder</h1>
        <p>Encode and Decode Base64 Strings</p>
    </header>

    <main>
        <div class="nav-links">
            <a href="index.html">&larr; Back to DevTools Hub</a>
        </div>

        <div class="tool-container">
            <label><strong>Enter Text:</strong></label>
            <textarea id="text-input" placeholder="Enter text to encode or Base64 to decode..."></textarea>
            <div style="margin-top: 1rem;">
                <button class="btn btn-primary" onclick="encodeBase64()">Encode</button>
                <button class="btn btn-secondary" onclick="decodeBase64()">Decode</button>
                <button class="btn btn-secondary" onclick="clearBase64()">Clear</button>
            </div>
        </div>

        <div class="tool-container">
            <label><strong>Result:</strong></label>
            <div id="result" class="result-box">Enter text and click Encode, or enter Base64 and click Decode.</div>
            <div style="margin-top: 1rem;">
                <button class="btn btn-primary" id="copy-btn" style="display:none;" onclick="copyResult()">Copy Result</button>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2025 DevTools Hub. All tools are free to use.</p>
    </footer>

    <script>
        function encodeBase64() {
            const input = document.getElementById('text-input').value;
            const result = document.getElementById('result');
            const copyBtn = document.getElementById('copy-btn');

            if (!input) {
                result.textContent = 'Please enter some text first.';
                return;
            }

            try {
                const encoded = btoa(unescape(encodeURIComponent(input)));
                result.textContent = encoded;
                copyBtn.style.display = 'inline-block';
            } catch (e) {
                result.textContent = 'Error: ' + e.message;
            }
        }

        function decodeBase64() {
            const input = document.getElementById('text-input').value;
            const result = document.getElementById('result');
            const copyBtn = document.getElementById('copy-btn');

            if (!input) {
                result.textContent = 'Please enter Base64 text to decode.';
                return;
            }

            try {
                const decoded = decodeURIComponent(escape(atob(input)));
                result.textContent = decoded;
                copyBtn.style.display = 'inline-block';
            } catch (e) {
                result.textContent = 'Error: Invalid Base64 string - ' + e.message;
            }
        }

        function clearBase64() {
            document.getElementById('text-input').value = '';
            document.getElementById('result').textContent = 'Enter text and click Encode, or enter Base64 and click Decode.';
            document.getElementById('copy-btn').style.display = 'none';
        }

        function copyResult() {
            const result = document.getElementById('result').textContent;
            navigator.clipboard.writeText(result).then(() => {
                alert('Copied to clipboard!');
            });
        }
    </script>
</body>
</html>
