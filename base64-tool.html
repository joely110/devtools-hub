<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Encode and decode Base64 strings instantly. Free online Base64 encoder/decoder. No signup required.">
    <meta name="keywords" content="Base64 encoder, Base64 decoder">
    <title>Base64 Encoder/Decoder - DevTools Hub</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div class="header-content">
            <a href="index.html" class="logo">
                <div class="logo-icon">{ }</div>
                <span class="logo-text">DevTools Hub</span>
            </a>
            <div class="header-right">
                <nav class="nav-links">
                    <a href="index.html">Tools</a>
                    <a href="index.html#about">About</a>
                </nav>
                <div class="theme-switcher">
                    <button class="theme-btn" data-theme="light" title="Light" onclick="setTheme('light')">☀</button>
                    <button class="theme-btn" data-theme="dark" title="Dark" onclick="setTheme('dark')">🌙</button>
                    <button class="theme-btn" data-theme="sepia" title="Sepia" onclick="setTheme('sepia')">📜</button>
                    <button class="theme-btn" data-theme="contrast" title="High Contrast" onclick="setTheme('contrast')">◐</button>
                </div>
            </div>
        </div>
    </header>

    <main>
        <a href="index.html" class="back-link">← Back to all tools</a>

        <div class="tool-header">
            <h1>Base64 Encoder/Decoder</h1>
            <p>Encode and decode Base64 strings instantly</p>
        </div>

        <div class="card">
            <div class="card-title">Input</div>
            <textarea id="text-input" placeholder="Enter text to encode or Base64 to decode..."></textarea>
            <div class="btn-group">
                <button class="btn btn-primary" onclick="encodeBase64()">Encode</button>
                <button class="btn btn-secondary" onclick="decodeBase64()">Decode</button>
                <button class="btn btn-secondary" onclick="clearBase64()">Clear</button>
            </div>
        </div>

        <div class="card" id="result-card" style="display: none;">
            <div class="card-title">Output</div>
            <div class="output-box" id="result"></div>
            <div class="btn-group">
                <button class="btn btn-primary" id="copy-btn" onclick="copyResult()">Copy</button>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 DevTools Hub. All tools are free to use.</p>
    </footer>

    <script>
        function setTheme(theme) {
            document.body.setAttribute('data-theme', theme);
            document.querySelectorAll('.theme-btn').forEach(btn => btn.classList.toggle('active', btn.getAttribute('data-theme') === theme));
            localStorage.setItem('theme', theme);
        }
        const savedTheme = localStorage.getItem('theme') || 'light';
        setTheme(savedTheme);

        function encodeBase64() {
            const input = document.getElementById('text-input').value;
            const result = document.getElementById('result');
            const resultCard = document.getElementById('result-card');
            if (!input) { result.textContent = 'Please enter some text first.'; resultCard.style.display = 'block'; return; }
            try { result.textContent = btoa(unescape(encodeURIComponent(input))); document.getElementById('copy-btn').style.display = 'inline-flex'; }
            catch (e) { result.textContent = 'Error: ' + e.message; }
            resultCard.style.display = 'block';
        }
        function decodeBase64() {
            const input = document.getElementById('text-input').value;
            const result = document.getElementById('result');
            const resultCard = document.getElementById('result-card');
            if (!input) { result.textContent = 'Please enter Base64 text to decode.'; resultCard.style.display = 'block'; return; }
            try { result.textContent = decodeURIComponent(escape(atob(input))); document.getElementById('copy-btn').style.display = 'inline-flex'; }
            catch (e) { result.textContent = 'Error: Invalid Base64 string - ' + e.message; }
            resultCard.style.display = 'block';
        }
        function clearBase64() { document.getElementById('text-input').value = ''; document.getElementById('result-card').style.display = 'none'; }
        function copyResult() { navigator.clipboard.writeText(document.getElementById('result').textContent).then(() => alert('Copied!')); }
    </script>
</body>
</html>
