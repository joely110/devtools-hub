<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Escape and unescape JSON strings. Handle special characters in JSON. Free JSON string escaper.">
    <meta name="keywords" content="json escape, json unescape, escape json, unescape json, json string">
    <title>JSON String Escape - DevTools Hub</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div class="header-content">
            <a href="index.html" class="logo"><div class="logo-icon">{ }</div><span class="logo-text">DevTools Hub</span></a>
            <div class="header-right">
                <nav class="nav-links"><a href="index.html">Tools</a><a href="index.html#about">About</a></nav>
                <div class="theme-switcher">
                    <button class="theme-btn" data-theme="light" title="Light" onclick="setTheme('light')">☀</button>
                    <button class="theme-btn" data-theme="dark" title="Dark" onclick="setTheme('dark')">🌙</button>
                    <button class="theme-btn" data-theme="sepia" title="Sepia" onclick="setTheme('sepia')">📜</button>
                    <button class="theme-btn" data-theme="contrast" title="High Contrast" onclick="setTheme('contrast')">◐</button>
                </div>
            </div>
        </div>
    </header>
    <main>
        <a href="index.html" class="back-link">← Back to all tools</a>
        <div class="tool-header"><h1>JSON String Escape</h1><p>Escape or unescape special characters for JSON strings</p></div>

        <div class="card">
            <div class="card-title">Input Text</div>
            <textarea id="input" placeholder='Enter text to escape for JSON...' style="height:150px;"></textarea>
            <div class="btn-group">
                <button class="btn btn-primary" onclick="escapeJson()">Escape for JSON</button>
                <button class="btn btn-primary" onclick="unescapeJson()">Unescape JSON</button>
                <button class="btn btn-secondary" onclick="clearInput()">Clear</button>
            </div>
        </div>

        <div class="card" id="result-card" style="display:none;">
            <div class="card-title">Output</div>
            <textarea id="output" style="height:150px;font-family:'SF Mono',Monaco,monospace;" readonly></textarea>
            <div class="btn-group">
                <button class="btn btn-primary" onclick="copyOutput()">Copy</button>
            </div>
        </div>
    </main>
    <footer><p>&copy; 2026 DevTools Hub. All tools are free to use.</p></footer>
    <script>
        function setTheme(theme) { document.body.setAttribute('data-theme', theme); document.querySelectorAll('.theme-btn').forEach(btn => btn.classList.toggle('active', btn.getAttribute('data-theme') === theme)); localStorage.setItem('theme', theme); }
        setTheme(localStorage.getItem('theme') || 'light');

        function escapeJson() {
            const input = document.getElementById('input').value;
            if (!input) { alert('Please enter text first.'); return; }
            const escaped = JSON.stringify(input).slice(1, -1);
            document.getElementById('output').value = escaped;
            document.getElementById('result-card').style.display = 'block';
        }

        function unescapeJson() {
            const input = document.getElementById('input').value;
            if (!input) { alert('Please enter text first.'); return; }
            try {
                const unescaped = JSON.parse('"' + input + '"');
                document.getElementById('output').value = unescaped;
                document.getElementById('result-card').style.display = 'block';
            } catch (e) { alert('Invalid escaped string: ' + e.message); }
        }

        function clearInput() { document.getElementById('input').value = ''; document.getElementById('output').value = ''; document.getElementById('result-card').style.display = 'none'; }
        function copyOutput() { navigator.clipboard.writeText(document.getElementById('output').value).then(() => alert('Copied!')); }
    </script>
</body>
</html>
