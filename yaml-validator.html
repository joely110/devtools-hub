<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Validate and format YAML. Check YAML syntax and convert to JSON. Free YAML validator for developers.">
    <meta name="keywords" content="yaml validator, yaml parser, validate yaml, yaml to json">
    <title>YAML Validator - DevTools Hub</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div class="header-content">
            <a href="index.html" class="logo"><div class="logo-icon">{ }</div><span class="logo-text">DevTools Hub</span></a>
            <div class="header-right">
                <nav class="nav-links"><a href="index.html">Tools</a><a href="index.html#about">About</a></nav>
                <div class="theme-switcher">
                    <button class="theme-btn" data-theme="light" title="Light" onclick="setTheme('light')">☀</button>
                    <button class="theme-btn" data-theme="dark" title="Dark" onclick="setTheme('dark')">🌙</button>
                    <button class="theme-btn" data-theme="sepia" title="Sepia" onclick="setTheme('sepia')">📜</button>
                    <button class="theme-btn" data-theme="contrast" title="High Contrast" onclick="setTheme('contrast')">◐</button>
                </div>
            </div>
        </div>
    </header>
    <main>
        <a href="index.html" class="back-link">← Back to all tools</a>
        <div class="tool-header"><h1>YAML Validator</h1><p>Validate YAML syntax and convert to JSON</p></div>

        <div class="card">
            <div class="card-title">YAML Input</div>
            <textarea id="yaml-input" placeholder="name: John&#10;age: 30&#10;items:&#10;  - item1&#10;  - item2" style="height:200px;"></textarea>
            <div class="btn-group">
                <button class="btn btn-primary" onclick="validateYAML()">Validate</button>
                <button class="btn btn-primary" onclick="toJSON()">Convert to JSON</button>
                <button class="btn btn-secondary" onclick="clearInput()">Clear</button>
            </div>
        </div>

        <div class="card" id="result-valid" style="display:none;">
            <div class="output-box success">✓ Valid YAML</div>
        </div>

        <div class="card" id="result-error" style="display:none;">
            <div class="error-box" id="error-message"></div>
        </div>

        <div class="card" id="result-output" style="display:none;">
            <div class="card-title">JSON Output</div>
            <textarea id="output" style="height:200px;" readonly></textarea>
            <div class="btn-group">
                <button class="btn btn-primary" onclick="copyOutput()">Copy</button>
            </div>
        </div>
    </main>
    <footer><p>&copy; 2026 DevTools Hub. All tools are free to use.</p></footer>
    <script>
        function setTheme(theme) { document.body.setAttribute('data-theme', theme); document.querySelectorAll('.theme-btn').forEach(btn => btn.classList.toggle('active', btn.getAttribute('data-theme') === theme)); localStorage.setItem('theme', theme); }
        setTheme(localStorage.getItem('theme') || 'light');

        function parseYAML(yaml, indent = 0) {
            const result = {};
            const lines = yaml.split('\n');
            let i = 0;
            while (i < lines.length) {
                const line = lines[i];
                const match = line.match(/^(\s*)(.+?):\s*(.*)$/);
                if (!match) { i++; continue; }
                const spaces = match[1].length;
                const key = match[2];
                const value = match[3];
                if (spaces < indent) break;
                if (spaces === indent) {
                    if (value.trim()) {
                        result[key] = value.trim().replace(/^["']|["']$/g, '');
                    } else {
                        const nextLines = lines.slice(i + 1);
                        let nextIndent = 0;
                        for (let j = 0; j < nextLines.length; j++) {
                            const m = nextLines[j].match(/^(\s*)/);
                            if (m && m[1].length > indent) { nextIndent = m[1].length; break; }
                        }
                        const subYaml = nextLines.filter((l, idx) => idx < nextLines.findIndex(l => l.match(/^[^\s]/) && l.match(/^\s{$spaces/}) && l.trim())).join('\n');
                        if (subYaml.trim()) {
                            const subResult = parseYAML(subYaml, spaces);
                            if (Array.isArray(subResult)) result[key] = subResult;
                            else if (typeof subResult === 'object') result[key] = subResult;
                            else result[key] = subYaml.split('\n').map(l => l.trim()).filter(l => l);
                        } else {
                            i++;
                            const items = [];
                            while (i < lines.length) {
                                const itemMatch = lines[i].match(/^(\s*)-\s*(.+)$/);
                                if (!itemMatch) break;
                                if (itemMatch[1].length <= indent) break;
                                items.push(itemMatch[2].trim().replace(/^["']|["']$/g, ''));
                                i++;
                            }
                            if (items.length) result[key] = items;
                            else i--;
                        }
                    }
                }
                i++;
            }
            return result;
        }

        function validateYAML() {
            const input = document.getElementById('yaml-input').value;
            if (!input.trim()) { alert('Please enter YAML first.'); return; }
            try {
                parseYAML(input);
                document.getElementById('result-valid').style.display = 'block';
                document.getElementById('result-error').style.display = 'none';
            } catch (e) {
                document.getElementById('result-valid').style.display = 'none';
                document.getElementById('result-error').style.display = 'block';
                document.getElementById('error-message').textContent = e.message;
            }
        }

        function toJSON() {
            const input = document.getElementById('yaml-input').value;
            if (!input.trim()) { alert('Please enter YAML first.'); return; }
            try {
                const obj = parseYAML(input);
                document.getElementById('output').value = JSON.stringify(obj, null, 2);
                document.getElementById('result-output').style.display = 'block';
                document.getElementById('result-valid').style.display = 'block';
                document.getElementById('result-error').style.display = 'none';
            } catch (e) {
                document.getElementById('result-valid').style.display = 'none';
                document.getElementById('result-error').style.display = 'block';
                document.getElementById('error-message').textContent = e.message;
            }
        }

        function clearInput() { document.getElementById('yaml-input').value = ''; document.getElementById('output').value = ''; document.getElementById('result-valid').style.display = 'none'; document.getElementById('result-error').style.display = 'none'; document.getElementById('result-output').style.display = 'none'; }
        function copyOutput() { navigator.clipboard.writeText(document.getElementById('output').value).then(() => alert('Copied!')); }
    </script>
</body>
</html>
