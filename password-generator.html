<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Generate secure random passwords online. Customizable length, include numbers, symbols, uppercase/lowercase. Free and instant.">
    <meta name="keywords" content="password generator, secure password, random password generator, password creator, online password tool">
    <title>Password Generator - Create Secure Random Passwords</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .tool-container {
            background: #fff;
            border-radius: 8px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .password-display {
            font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
            font-size: 1.5rem;
            padding: 1.5rem;
            background: #f7fafc;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            margin: 1rem 0;
            word-break: break-all;
            text-align: center;
        }
        .options {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin: 1.5rem 0;
        }
        .option-item {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }
        .option-item input[type="number"] {
            width: 80px;
            padding: 0.5rem;
            border: 1px solid #ddd;
            border-radius: 6px;
        }
        .strength-meter {
            height: 10px;
            background: #e2e8f0;
            border-radius: 5px;
            margin-top: 1rem;
            overflow: hidden;
        }
        .strength-bar {
            height: 100%;
            transition: width 0.3s, background 0.3s;
            border-radius: 5px;
        }
        .strength-text {
            text-align: center;
            margin-top: 0.5rem;
            font-weight: 600;
        }
        .nav-links { margin-bottom: 1.5rem; }
        .nav-links a { color: #4a90d9; text-decoration: none; }
        .nav-links a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <header>
        <h1>Password Generator</h1>
        <p>Create Secure Random Passwords Instantly</p>
    </header>

    <main>
        <div class="nav-links">
            <a href="index.html">&larr; Back to DevTools Hub</a>
        </div>

        <div class="tool-container">
            <div class="password-display" id="password-display">Click Generate to create a password</div>
            <div style="text-align: center;">
                <button class="btn btn-primary" onclick="generatePassword()">Generate Password</button>
                <button class="btn btn-secondary" onclick="copyPassword()">Copy</button>
            </div>

            <div class="strength-meter">
                <div class="strength-bar" id="strength-bar"></div>
            </div>
            <div class="strength-text" id="strength-text"></div>
        </div>

        <div class="tool-container">
            <h3>Options</h3>
            <div class="options">
                <div class="option-item">
                    <label>Length:</label>
                    <input type="number" id="length" value="16" min="4" max="128">
                </div>
                <div class="option-item">
                    <label><input type="checkbox" id="uppercase" checked> Uppercase (A-Z)</label>
                </div>
                <div class="option-item">
                    <label><input type="checkbox" id="lowercase" checked> Lowercase (a-z)</label>
                </div>
                <div class="option-item">
                    <label><input type="checkbox" id="numbers" checked> Numbers (0-9)</label>
                </div>
                <div class="option-item">
                    <label><input type="checkbox" id="symbols" checked> Symbols (!@#$%)</label>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 DevTools Hub. All tools are free to use.</p>
    </footer>

    <script>
        const uppercase = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
        const lowercase = 'abcdefghijklmnopqrstuvwxyz';
        const numbers = '0123456789';
        const symbols = '!@#$%^&*()_+-=[]{}|;:,.<>?';

        function generatePassword() {
            let chars = '';
            if (document.getElementById('uppercase').checked) chars += uppercase;
            if (document.getElementById('lowercase').checked) chars += lowercase;
            if (document.getElementById('numbers').checked) chars += numbers;
            if (document.getElementById('symbols').checked) chars += symbols;

            if (!chars) {
                alert('Please select at least one character type.');
                return;
            }

            const length = parseInt(document.getElementById('length').value) || 16;
            let password = '';
            for (let i = 0; i < length; i++) {
                password += chars.charAt(Math.floor(Math.random() * chars.length));
            }

            document.getElementById('password-display').textContent = password;
            updateStrengthMeter(password);
        }

        function updateStrengthMeter(password) {
            let strength = 0;
            const bar = document.getElementById('strength-bar');
            const text = document.getElementById('strength-text');

            if (password.length >= 8) strength += 25;
            if (password.length >= 12) strength += 25;
            if (/[A-Z]/.test(password) && /[a-z]/.test(password)) strength += 15;
            if (/[0-9]/.test(password)) strength += 15;
            if (/[^A-Za-z0-9]/.test(password)) strength += 20;

            bar.style.width = strength + '%';

            if (strength < 40) {
                bar.style.background = '#e53e3e';
                text.textContent = 'Weak';
                text.style.color = '#e53e3e';
            } else if (strength < 70) {
                bar.style.background = '#dd6b20';
                text.textContent = 'Medium';
                text.style.color = '#dd6b20';
            } else {
                bar.style.background = '#38a169';
                text.textContent = 'Strong';
                text.style.color = '#38a169';
            }
        }

        function copyPassword() {
            const password = document.getElementById('password-display').textContent;
            if (password && !password.includes('Click generate')) {
                navigator.clipboard.writeText(password).then(() => {
                    alert('Password copied to clipboard!');
                });
            }
        }

        // Generate one on load
        generatePassword();
    </script>
</body>
</html>
