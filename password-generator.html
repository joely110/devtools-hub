<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Generate secure random passwords instantly. Customizable length and character options.">
    <meta name="keywords" content="password generator, secure password, random password">
    <title>Password Generator - DevTools Hub</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div class="header-content">
            <a href="index.html" class="logo"><div class="logo-icon">{ }</div><span class="logo-text">DevTools Hub</span></a>
            <div class="header-right">
                <nav class="nav-links"><a href="index.html">Tools</a><a href="index.html#about">About</a></nav>
                <div class="theme-switcher">
                    <button class="theme-btn" data-theme="light" title="Light" onclick="setTheme('light')">☀</button>
                    <button class="theme-btn" data-theme="dark" title="Dark" onclick="setTheme('dark')">🌙</button>
                    <button class="theme-btn" data-theme="sepia" title="Sepia" onclick="setTheme('sepia')">📜</button>
                    <button class="theme-btn" data-theme="contrast" title="High Contrast" onclick="setTheme('contrast')">◐</button>
                </div>
            </div>
        </div>
    </header>
    <main>
        <a href="index.html" class="back-link">← Back to all tools</a>
        <div class="tool-header"><h1>Password Generator</h1><p>Create secure random passwords instantly</p></div>
        <div class="card">
            <div class="password-display" id="password-display">Click Generate</div>
            <div style="display:flex;gap:0.5rem;justify-content:center;margin-top:1rem;">
                <button class="btn btn-primary" onclick="generatePassword()">Generate</button>
                <button class="btn btn-secondary" onclick="copyPassword()">Copy</button>
            </div>
            <div class="strength-meter"><div class="strength-bar" id="strength-bar"></div></div>
            <div class="strength-text" id="strength-text" style="text-align:center;margin-top:0.5rem;font-weight:600;"></div>
        </div>
        <div class="card">
            <div class="card-title">Options</div>
            <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:1rem;margin-top:1rem;">
                <div style="display:flex;align-items:center;gap:0.75rem;"><label>Length:</label><input type="number" id="length" value="16" min="4" max="128" style="width:70px;padding:0.5rem;border:1px solid var(--border);border-radius:6px;"></div>
                <label class="flag-label"><input type="checkbox" id="uppercase" checked> Uppercase (A-Z)</label>
                <label class="flag-label"><input type="checkbox" id="lowercase" checked> Lowercase (a-z)</label>
                <label class="flag-label"><input type="checkbox" id="numbers" checked> Numbers (0-9)</label>
                <label class="flag-label"><input type="checkbox" id="symbols" checked> Symbols (!@#$%)</label>
            </div>
        </div>
    </main>
    <footer><p>&copy; 2026 DevTools Hub. All tools are free to use.</p></footer>
    <script>
        function setTheme(theme) { document.body.setAttribute('data-theme', theme); document.querySelectorAll('.theme-btn').forEach(btn => btn.classList.toggle('active', btn.getAttribute('data-theme') === theme)); localStorage.setItem('theme', theme); }
        setTheme(localStorage.getItem('theme') || 'light');

        const uppercase = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
        const lowercase = 'abcdefghijklmnopqrstuvwxyz';
        const numbers = '0123456789';
        const symbols = '!@#$%^&*()_+-=[]{}|;:,.<>?';

        function generatePassword() {
            let chars = '';
            if (document.getElementById('uppercase').checked) chars += uppercase;
            if (document.getElementById('lowercase').checked) chars += lowercase;
            if (document.getElementById('numbers').checked) chars += numbers;
            if (document.getElementById('symbols').checked) chars += symbols;
            if (!chars) { alert('Select at least one character type.'); return; }
            const length = parseInt(document.getElementById('length').value) || 16;
            let password = '';
            for (let i = 0; i < length; i++) password += chars.charAt(Math.floor(Math.random() * chars.length));
            document.getElementById('password-display').textContent = password;
            updateStrength(password);
        }

        function updateStrength(password) {
            let strength = 0;
            if (password.length >= 8) strength += 25;
            if (password.length >= 12) strength += 25;
            if (/[A-Z]/.test(password) && /[a-z]/.test(password)) strength += 15;
            if (/[0-9]/.test(password)) strength += 15;
            if (/[^A-Za-z0-9]/.test(password)) strength += 20;
            const bar = document.getElementById('strength-bar');
            const text = document.getElementById('strength-text');
            bar.style.width = strength + '%';
            if (strength < 40) { bar.style.background = 'var(--error)'; text.textContent = 'Weak'; text.style.color = 'var(--error)'; }
            else if (strength < 70) { bar.style.background = '#f59e0b'; text.textContent = 'Medium'; text.style.color = '#f59e0b'; }
            else { bar.style.background = 'var(--success)'; text.textContent = 'Strong'; text.style.color = 'var(--success)'; }
        }

        function copyPassword() { const password = document.getElementById('password-display').textContent; if (!password.includes('Click')) navigator.clipboard.writeText(password).then(() => alert('Password copied!')); }
        generatePassword();
    </script>
</body>
</html>
