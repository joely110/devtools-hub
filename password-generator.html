<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Generate secure random passwords instantly. Customizable length and character options. Free password generator.">
    <meta name="keywords" content="password generator, secure password, random password, password creator">
    <title>Password Generator - DevTools Hub</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .tool-header { margin-bottom: 2rem; }
        .tool-header h1 { font-size: 1.75rem; font-weight: 700; margin-bottom: 0.5rem; }
        .tool-header p { color: var(--text-muted); }
        .back-link { display: inline-flex; align-items: center; gap: 0.5rem; color: var(--primary); text-decoration: none; font-weight: 500; margin-bottom: 1.5rem; }
        .back-link:hover { text-decoration: underline; }
        .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.5rem; margin-bottom: 1rem; }
        .card-title { font-size: 0.875rem; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.75rem; }
        .password-display { font-family: 'SF Mono', Monaco, monospace; font-size: 1.3rem; padding: 1.5rem; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; text-align: center; word-break: break-all; margin: 1rem 0; }
        .strength-meter { height: 8px; background: var(--border); border-radius: 4px; margin-top: 1rem; overflow: hidden; }
        .strength-bar { height: 100%; border-radius: 4px; transition: width 0.3s, background 0.3s; }
        .strength-text { text-align: center; margin-top: 0.5rem; font-weight: 600; font-size: 0.9rem; }
        .options-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 1rem; margin: 1.5rem 0; }
        .option-item { display: flex; align-items: center; gap: 0.75rem; }
        .option-item input[type="number"] { width: 70px; padding: 0.5rem; border: 1px solid var(--border); border-radius: 6px; }
    </style>
</head>
<body>
    <header>
        <div class="header-content">
            <a href="index.html" class="logo">
                <div class="logo-icon">{ }</div>
                <span class="logo-text">DevTools Hub</span>
            </a>
            <nav class="nav-links">
                <a href="index.html">Tools</a>
                <a href="index.html#about">About</a>
            </nav>
        </div>
    </header>

    <main>
        <a href="index.html" class="back-link">&larr; Back to all tools</a>

        <div class="tool-header">
            <h1>Password Generator</h1>
            <p>Create secure random passwords instantly</p>
        </div>

        <div class="card">
            <div class="password-display" id="password-display">Click Generate</div>
            <div style="display: flex; gap: 0.5rem; justify-content: center;">
                <button class="btn btn-primary" onclick="generatePassword()">Generate</button>
                <button class="btn btn-secondary" onclick="copyPassword()">Copy</button>
            </div>
            <div class="strength-meter">
                <div class="strength-bar" id="strength-bar"></div>
            </div>
            <div class="strength-text" id="strength-text"></div>
        </div>

        <div class="card">
            <div class="card-title">Options</div>
            <div class="options-grid">
                <div class="option-item">
                    <label>Length:</label>
                    <input type="number" id="length" value="16" min="4" max="128">
                </div>
                <label class="option-item"><input type="checkbox" id="uppercase" checked> Uppercase (A-Z)</label>
                <label class="option-item"><input type="checkbox" id="lowercase" checked> Lowercase (a-z)</label>
                <label class="option-item"><input type="checkbox" id="numbers" checked> Numbers (0-9)</label>
                <label class="option-item"><input type="checkbox" id="symbols" checked> Symbols (!@#$%)</label>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 DevTools Hub. All tools are free to use.</p>
    </footer>

    <script>
        const uppercase = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
        const lowercase = 'abcdefghijklmnopqrstuvwxyz';
        const numbers = '0123456789';
        const symbols = '!@#$%^&*()_+-=[]{}|;:,.<>?';

        function generatePassword() {
            let chars = '';
            if (document.getElementById('uppercase').checked) chars += uppercase;
            if (document.getElementById('lowercase').checked) chars += lowercase;
            if (document.getElementById('numbers').checked) chars += numbers;
            if (document.getElementById('symbols').checked) chars += symbols;
            if (!chars) { alert('Select at least one character type.'); return; }
            const length = parseInt(document.getElementById('length').value) || 16;
            let password = '';
            for (let i = 0; i < length; i++) password += chars.charAt(Math.floor(Math.random() * chars.length));
            document.getElementById('password-display').textContent = password;
            updateStrength(password);
        }

        function updateStrength(password) {
            let strength = 0;
            if (password.length >= 8) strength += 25;
            if (password.length >= 12) strength += 25;
            if (/[A-Z]/.test(password) && /[a-z]/.test(password)) strength += 15;
            if (/[0-9]/.test(password)) strength += 15;
            if (/[^A-Za-z0-9]/.test(password)) strength += 20;
            const bar = document.getElementById('strength-bar');
            const text = document.getElementById('strength-text');
            bar.style.width = strength + '%';
            if (strength < 40) { bar.style.background = '#dc2626'; text.textContent = 'Weak'; text.style.color = '#dc2626'; }
            else if (strength < 70) { bar.style.background = '#f59e0b'; text.textContent = 'Medium'; text.style.color = '#f59e0b'; }
            else { bar.style.background = '#22c55e'; text.textContent = 'Strong'; text.style.color = '#22c55e'; }
        }

        function copyPassword() {
            const password = document.getElementById('password-display').textContent;
            if (!password.includes('Click')) navigator.clipboard.writeText(password).then(() => alert('Password copied!'));
        }

        generatePassword();
    </script>
</body>
</html>
