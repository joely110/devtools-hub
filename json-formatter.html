<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Free online JSON formatter and validator. Format, minify, and validate JSON data with syntax highlighting. No signup required.">
    <meta name="keywords" content="JSON formatter, JSON validator, JSON minifier, format JSON, validate JSON, online JSON tool">
    <title>JSON Formatter & Validator - Free Online Tool</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .tool-container {
            background: #fff;
            border-radius: 8px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        textarea {
            width: 100%;
            height: 250px;
            padding: 1rem;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
            font-size: 14px;
            resize: vertical;
        }
        textarea:focus {
            outline: none;
            border-color: #4a90d9;
        }
        .btn-group {
            display: flex;
            gap: 0.75rem;
            margin: 1rem 0;
            flex-wrap: wrap;
        }
        .btn {
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1rem;
            transition: background 0.2s;
        }
        .btn-primary {
            background: #4a90d9;
            color: #fff;
        }
        .btn-primary:hover {
            background: #3a7bc8;
        }
        .btn-secondary {
            background: #e2e8f0;
            color: #333;
        }
        .btn-secondary:hover {
            background: #cbd5e0;
        }
        .result-box {
            margin-top: 1rem;
            padding: 1rem;
            border-radius: 6px;
            font-family: monospace;
            white-space: pre-wrap;
            word-break: break-all;
            max-height: 400px;
            overflow-y: auto;
        }
        .result-box.valid {
            background: #f0fff4;
            border: 1px solid #9ae6b4;
            color: #22543d;
        }
        .result-box.invalid {
            background: #fff5f5;
            border: 1px solid #feb2b2;
            color: #742a2a;
        }
        .result-box.minified {
            background: #f7fafc;
            border: 1px solid #e2e8f0;
            color: #2d3748;
        }
        .nav-links {
            margin-bottom: 1.5rem;
        }
        .nav-links a {
            color: #4a90d9;
            text-decoration: none;
        }
        .nav-links a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <header>
        <h1>JSON Formatter</h1>
        <p>Format, Minify & Validate JSON Data</p>
    </header>

    <main>
        <div class="nav-links">
            <a href="index.html">&larr; Back to DevTools Hub</a>
        </div>

        <div class="tool-container">
            <label for="json-input"><strong>Enter JSON:</strong></label>
            <textarea id="json-input" placeholder="Paste your JSON here..."></textarea>
            <div class="btn-group">
                <button class="btn btn-primary" onclick="formatJSON()">Format</button>
                <button class="btn btn-secondary" onclick="minifyJSON()">Minify</button>
                <button class="btn btn-secondary" onclick="validateJSON()">Validate</button>
                <button class="btn btn-secondary" onclick="clearJSON()">Clear</button>
            </div>
        </div>

        <div class="tool-container">
            <label><strong>Result:</strong></label>
            <div id="result" class="result-box"></div>
            <div class="btn-group" id="copy-btn-group" style="display:none;">
                <button class="btn btn-primary" onclick="copyResult()">Copy Result</button>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2025 DevTools Hub. All tools are free to use.</p>
    </footer>

    <script>
        function formatJSON() {
            const input = document.getElementById('json-input').value;
            const result = document.getElementById('result');
            const copyBtnGroup = document.getElementById('copy-btn-group');

            if (!input.trim()) {
                result.className = 'result-box invalid';
                result.textContent = 'Please enter some JSON first.';
                return;
            }

            try {
                const parsed = JSON.parse(input);
                const formatted = JSON.stringify(parsed, null, 2);
                result.className = 'result-box valid';
                result.textContent = formatted;
                copyBtnGroup.style.display = 'block';
            } catch (e) {
                result.className = 'result-box invalid';
                result.textContent = 'Invalid JSON: ' + e.message;
                copyBtnGroup.style.display = 'none';
            }
        }

        function minifyJSON() {
            const input = document.getElementById('json-input').value;
            const result = document.getElementById('result');
            const copyBtnGroup = document.getElementById('copy-btn-group');

            if (!input.trim()) {
                result.className = 'result-box invalid';
                result.textContent = 'Please enter some JSON first.';
                return;
            }

            try {
                const parsed = JSON.parse(input);
                const minified = JSON.stringify(parsed);
                result.className = 'result-box minified';
                result.textContent = minified;
                copyBtnGroup.style.display = 'block';
            } catch (e) {
                result.className = 'result-box invalid';
                result.textContent = 'Invalid JSON: ' + e.message;
                copyBtnGroup.style.display = 'none';
            }
        }

        function validateJSON() {
            const input = document.getElementById('json-input').value;
            const result = document.getElementById('result');
            const copyBtnGroup = document.getElementById('copy-btn-group');

            if (!input.trim()) {
                result.className = 'result-box invalid';
                result.textContent = 'Please enter some JSON first.';
                return;
            }

            try {
                JSON.parse(input);
                result.className = 'result-box valid';
                result.textContent = 'Valid JSON ✓';
                copyBtnGroup.style.display = 'none';
            } catch (e) {
                result.className = 'result-box invalid';
                result.textContent = 'Invalid JSON: ' + e.message;
                copyBtnGroup.style.display = 'none';
            }
        }

        function clearJSON() {
            document.getElementById('json-input').value = '';
            document.getElementById('result').textContent = '';
            document.getElementById('copy-btn-group').style.display = 'none';
        }

        function copyResult() {
            const result = document.getElementById('result').textContent;
            navigator.clipboard.writeText(result).then(() => {
                alert('Copied to clipboard!');
            });
        }
    </script>
</body>
</html>
