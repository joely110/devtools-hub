<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Format, minify, and validate JSON data instantly. Free online JSON formatter and validator. No signup required.">
    <meta name="keywords" content="JSON formatter, JSON validator, JSON minifier, format JSON, validate JSON">
    <title>JSON Formatter - DevTools Hub</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div class="header-content">
            <a href="index.html" class="logo">
                <div class="logo-icon">{ }</div>
                <span class="logo-text">DevTools Hub</span>
            </a>
            <div class="header-right">
                <nav class="nav-links">
                    <a href="index.html">Tools</a>
                    <a href="index.html#about">About</a>
                </nav>
                <div class="theme-switcher">
                    <button class="theme-btn" data-theme="light" title="Light" onclick="setTheme('light')">☀</button>
                    <button class="theme-btn" data-theme="dark" title="Dark" onclick="setTheme('dark')">🌙</button>
                    <button class="theme-btn" data-theme="sepia" title="Sepia" onclick="setTheme('sepia')">📜</button>
                    <button class="theme-btn" data-theme="contrast" title="High Contrast" onclick="setTheme('contrast')">◐</button>
                </div>
            </div>
        </div>
    </header>

    <main>
        <a href="index.html" class="back-link">← Back to all tools</a>

        <div class="tool-header">
            <h1>JSON Formatter</h1>
            <p>Format, minify, and validate JSON data instantly</p>
        </div>

        <div class="card">
            <div class="card-title">Input</div>
            <textarea id="json-input" placeholder='{"name": "John", "age": 30, "city": "New York"}'></textarea>
            <div class="btn-group">
                <button class="btn btn-primary" onclick="formatJSON()">Format</button>
                <button class="btn btn-secondary" onclick="minifyJSON()">Minify</button>
                <button class="btn btn-secondary" onclick="validateJSON()">Validate</button>
                <button class="btn btn-secondary" onclick="clearJSON()">Clear</button>
            </div>
        </div>

        <div class="card" id="result-card" style="display: none;">
            <div class="card-title">Output <span class="badge" id="status-badge"></span></div>
            <div class="output-box" id="output"></div>
            <div class="btn-group">
                <button class="btn btn-primary" id="copy-btn" onclick="copyResult()">Copy</button>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 DevTools Hub. All tools are free to use.</p>
    </footer>

    <script>
        function setTheme(theme) {
            document.body.setAttribute('data-theme', theme);
            document.querySelectorAll('.theme-btn').forEach(btn => {
                btn.classList.toggle('active', btn.getAttribute('data-theme') === theme);
            });
            localStorage.setItem('theme', theme);
        }
        const savedTheme = localStorage.getItem('theme') || 'light';
        setTheme(savedTheme);

        function formatJSON() {
            const input = document.getElementById('json-input').value;
            const resultCard = document.getElementById('result-card');
            const output = document.getElementById('output');
            const badge = document.getElementById('status-badge');
            if (!input.trim()) { showError('Please enter some JSON first.'); return; }
            try {
                const parsed = JSON.parse(input);
                output.textContent = JSON.stringify(parsed, null, 2);
                output.className = 'output-box success';
                badge.textContent = 'Valid';
                badge.className = 'badge badge-success';
                resultCard.style.display = 'block';
                document.getElementById('copy-btn').style.display = 'inline-flex';
            } catch (e) { showError('Invalid JSON: ' + e.message); }
        }
        function minifyJSON() {
            const input = document.getElementById('json-input').value;
            const resultCard = document.getElementById('result-card');
            const output = document.getElementById('output');
            const badge = document.getElementById('status-badge');
            if (!input.trim()) { showError('Please enter some JSON first.'); return; }
            try {
                const parsed = JSON.parse(input);
                output.textContent = JSON.stringify(parsed);
                output.className = 'output-box';
                badge.textContent = 'Minified';
                badge.className = 'badge badge-success';
                resultCard.style.display = 'block';
                document.getElementById('copy-btn').style.display = 'inline-flex';
            } catch (e) { showError('Invalid JSON: ' + e.message); }
        }
        function validateJSON() {
            const input = document.getElementById('json-input').value;
            const resultCard = document.getElementById('result-card');
            const output = document.getElementById('output');
            const badge = document.getElementById('status-badge');
            if (!input.trim()) { showError('Please enter some JSON first.'); return; }
            try {
                JSON.parse(input);
                output.textContent = '✓ Valid JSON';
                output.className = 'output-box success';
                badge.textContent = 'Valid';
                badge.className = 'badge badge-success';
                resultCard.style.display = 'block';
                document.getElementById('copy-btn').style.display = 'none';
            } catch (e) { showError('Invalid JSON: ' + e.message); }
        }
        function showError(message) {
            const resultCard = document.getElementById('result-card');
            const output = document.getElementById('output');
            const badge = document.getElementById('status-badge');
            output.textContent = message;
            output.className = 'output-box error';
            badge.textContent = 'Error';
            badge.className = 'badge badge-error';
            resultCard.style.display = 'block';
        }
        function clearJSON() { document.getElementById('json-input').value = ''; document.getElementById('result-card').style.display = 'none'; }
        function copyResult() { navigator.clipboard.writeText(document.getElementById('output').textContent).then(() => alert('Copied!')); }
    </script>
</body>
</html>
