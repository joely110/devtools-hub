<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Build cron schedule expressions easily. Visual crontab generator with common presets.">
    <meta name="keywords" content="cron generator, cron expression, crontab">
    <title>Crontab Generator - DevTools Hub</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div class="header-content">
            <a href="index.html" class="logo"><div class="logo-icon">{ }</div><span class="logo-text">DevTools Hub</span></a>
            <div class="header-right">
                <nav class="nav-links"><a href="index.html">Tools</a><a href="index.html#about">About</a></nav>
                <div class="theme-switcher">
                    <button class="theme-btn" data-theme="light" title="Light" onclick="setTheme('light')">☀</button>
                    <button class="theme-btn" data-theme="dark" title="Dark" onclick="setTheme('dark')">🌙</button>
                    <button class="theme-btn" data-theme="sepia" title="Sepia" onclick="setTheme('sepia')">📜</button>
                    <button class="theme-btn" data-theme="contrast" title="High Contrast" onclick="setTheme('contrast')">◐</button>
                </div>
            </div>
        </div>
    </header>
    <main>
        <a href="index.html" class="back-link">← Back to all tools</a>
        <div class="tool-header"><h1>Crontab Generator</h1><p>Build and visualize cron schedule expressions</p></div>
        <div class="card">
            <div class="card-title">Expression</div>
            <div class="cron-display" id="cron-expression">* * * * *</div>
            <div style="display:flex;gap:0.5rem;margin-bottom:1rem;">
                <button class="btn btn-primary" onclick="updateCron()">Update</button>
                <button class="btn btn-secondary" onclick="copyCron()">Copy</button>
            </div>
            <div class="cron-description" id="cron-description">Runs every minute</div>
        </div>
        <div class="card">
            <div class="card-title">Configure</div>
            <div style="display:grid;gap:1rem;margin-top:1rem;">
                <div style="display:flex;align-items:center;gap:1rem;flex-wrap:wrap;">
                    <label style="min-width:80px;font-weight:600;">Minute:</label>
                    <input type="text" id="minute" value="*" style="width:80px;padding:0.5rem;border:1px solid var(--border);border-radius:6px;">
                    <select onchange="document.getElementById('minute').value=this.value;updateCron()" style="padding:0.5rem;border:1px solid var(--border);border-radius:6px;max-width:200px;">
                        <option value="*">Every minute</option><option value="0">At minute 0</option><option value="15">At minute 15</option><option value="30">At minute 30</option><option value="45">At minute 45</option><option value="*/5">Every 5 min</option><option value="*/15">Every 15 min</option><option value="*/30">Every 30 min</option>
                    </select>
                </div>
                <div style="display:flex;align-items:center;gap:1rem;flex-wrap:wrap;">
                    <label style="min-width:80px;font-weight:600;">Hour:</label>
                    <input type="text" id="hour" value="*" style="width:80px;padding:0.5rem;border:1px solid var(--border);border-radius:6px;">
                    <select onchange="document.getElementById('hour').value=this.value;updateCron()" style="padding:0.5rem;border:1px solid var(--border);border-radius:6px;max-width:200px;">
                        <option value="*">Every hour</option><option value="0">Midnight</option><option value="9">9 AM</option><option value="12">Noon</option><option value="18">6 PM</option><option value="*/2">Every 2 hours</option>
                    </select>
                </div>
                <div style="display:flex;align-items:center;gap:1rem;flex-wrap:wrap;">
                    <label style="min-width:80px;font-weight:600;">Day:</label>
                    <input type="text" id="day" value="*" style="width:80px;padding:0.5rem;border:1px solid var(--border);border-radius:6px;">
                    <select onchange="document.getElementById('day').value=this.value;updateCron()" style="padding:0.5rem;border:1px solid var(--border);border-radius:6px;max-width:200px;">
                        <option value="*">Every day</option><option value="1">1st of month</option><option value="15">15th of month</option><option value="1,15">1st & 15th</option>
                    </select>
                </div>
                <div style="display:flex;align-items:center;gap:1rem;flex-wrap:wrap;">
                    <label style="min-width:80px;font-weight:600;">Month:</label>
                    <input type="text" id="month" value="*" style="width:80px;padding:0.5rem;border:1px solid var(--border);border-radius:6px;">
                    <select onchange="document.getElementById('month').value=this.value;updateCron()" style="padding:0.5rem;border:1px solid var(--border);border-radius:6px;max-width:200px;">
                        <option value="*">Every month</option><option value="1">January</option><option value="6">June</option><option value="12">December</option><option value="*/3">Quarterly</option>
                    </select>
                </div>
                <div style="display:flex;align-items:center;gap:1rem;flex-wrap:wrap;">
                    <label style="min-width:80px;font-weight:600;">Weekday:</label>
                    <input type="text" id="weekday" value="*" style="width:80px;padding:0.5rem;border:1px solid var(--border);border-radius:6px;">
                    <select onchange="document.getElementById('weekday').value=this.value;updateCron()" style="padding:0.5rem;border:1px solid var(--border);border-radius:6px;max-width:200px;">
                        <option value="*">Every day</option><option value="1-5">Mon-Fri</option><option value="0,6">Sat-Sun</option><option value="1">Monday</option><option value="5">Friday</option>
                    </select>
                </div>
            </div>
        </div>
        <div class="card">
            <div class="card-title">Common Presets</div>
            <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:0.75rem;margin-top:1rem;">
                <button class="preset-btn" onclick="setCron('* * * * *')"><strong>Every minute</strong><code>* * * * *</code></button>
                <button class="preset-btn" onclick="setCron('*/5 * * * *')"><strong>Every 5 minutes</strong><code>*/5 * * * *</code></button>
                <button class="preset-btn" onclick="setCron('0 * * * *')"><strong>Every hour</strong><code>0 * * * *</code></button>
                <button class="preset-btn" onclick="setCron('0 0 * * *')"><strong>Daily midnight</strong><code>0 0 * * *</code></button>
                <button class="preset-btn" onclick="setCron('0 9 * * 1-5')"><strong>Weekdays 9 AM</strong><code>0 9 * * 1-5</code></button>
                <button class="preset-btn" onclick="setCron('0 0 1 * *')"><strong>Monthly (1st)</strong><code>0 0 1 * *</code></button>
            </div>
        </div>
    </main>
    <footer><p>&copy; 2026 DevTools Hub. All tools are free to use.</p></footer>
    <script>
        function setTheme(theme) { document.body.setAttribute('data-theme', theme); document.querySelectorAll('.theme-btn').forEach(btn => btn.classList.toggle('active', btn.getAttribute('data-theme') === theme)); localStorage.setItem('theme', theme); }
        setTheme(localStorage.getItem('theme') || 'light');

        function setCron(expr) { const parts = expr.split(' '); if (parts.length === 5) { document.getElementById('minute').value = parts[0]; document.getElementById('hour').value = parts[1]; document.getElementById('day').value = parts[2]; document.getElementById('month').value = parts[3]; document.getElementById('weekday').value = parts[4]; updateCron(); } }
        function updateCron() { const m = document.getElementById('minute').value || '*'; const h = document.getElementById('hour').value || '*'; const d = document.getElementById('day').value || '*'; const mon = document.getElementById('month').value || '*'; const w = document.getElementById('weekday').value || '*'; const expr = `${m} ${h} ${d} ${mon} ${w}`; document.getElementById('cron-expression').textContent = expr; document.getElementById('cron-description').textContent = describeCron(expr); }
        function describeCron(expr) { const [min, hour, day, mon, wday] = expr.split(' '); let desc = []; if (min === '*' && hour === '*') desc.push('Every minute'); else if (min === '*/5') desc.push('Every 5 minutes'); else if (min === '*/15') desc.push('Every 15 minutes'); else if (min === '*/30') desc.push('Every 30 minutes'); else if (hour !== '*' && min !== '*') desc.push(`At ${hour.padStart(2,'0')}:${min.padStart(2,'0')}`); if (wday === '1-5') desc.push('Monday through Friday'); else if (wday === '0,6') desc.push('on weekends'); else if (wday === '1') desc.push('on Monday'); else if (wday === '5') desc.push('on Friday'); if (day === '1' && mon === '*') desc.push('on the 1st of every month'); if (day === '1,15') desc.push('on the 1st and 15th'); return desc.join(' ') || 'Custom schedule'; }
        function copyCron() { navigator.clipboard.writeText(document.getElementById('cron-expression').textContent).then(() => alert('Copied!')); }
        updateCron();
    </script>
</body>
</html>
