<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Convert between number bases: binary, decimal, hex, octal. Instant conversion with step-by-step explanation.">
    <meta name="keywords" content="binary converter, hex converter, decimal converter, base converter, number base">
    <title>Number Base Converter - DevTools Hub</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div class="header-content">
            <a href="index.html" class="logo"><div class="logo-icon">{ }</div><span class="logo-text">DevTools Hub</span></a>
            <div class="header-right">
                <nav class="nav-links"><a href="index.html">Tools</a><a href="index.html#about">About</a></nav>
                <div class="theme-switcher">
                    <button class="theme-btn" data-theme="light" title="Light" onclick="setTheme('light')">☀</button>
                    <button class="theme-btn" data-theme="dark" title="Dark" onclick="setTheme('dark')">🌙</button>
                    <button class="theme-btn" data-theme="sepia" title="Sepia" onclick="setTheme('sepia')">📜</button>
                    <button class="theme-btn" data-theme="contrast" title="High Contrast" onclick="setTheme('contrast')">◐</button>
                </div>
            </div>
        </div>
    </header>
    <main>
        <a href="index.html" class="back-link">← Back to all tools</a>
        <div class="tool-header"><h1>Number Base Converter</h1><p>Convert between binary, decimal, hexadecimal, and octal</p></div>

        <div class="card">
            <div class="card-title">Input Number</div>
            <div style="display:flex;gap:1rem;align-items:center;flex-wrap:wrap;margin-top:1rem;">
                <input type="text" id="input-number" placeholder="Enter number..." style="flex:1;min-width:200px;padding:0.75rem;border:1px solid var(--border);border-radius:8px;">
                <select id="from-base" style="padding:0.75rem;border:1px solid var(--border);border-radius:8px;background:var(--card-bg);color:var(--text);">
                    <option value="2">Binary (2)</option>
                    <option value="8">Octal (8)</option>
                    <option value="10" selected>Decimal (10)</option>
                    <option value="16">Hexadecimal (16)</option>
                </select>
            </div>
            <div class="btn-group">
                <button class="btn btn-primary" onclick="convert()">Convert</button>
            </div>
        </div>

        <div class="card" id="result-card" style="display:none;">
            <div class="card-title">Conversions</div>
            <div style="display:grid;gap:0.75rem;margin-top:1rem;">
                <div class="result-item"><label>Binary</label><code id="result-bin"></code></div>
                <div class="result-item"><label>Octal</label><code id="result-oct"></code></div>
                <div class="result-item"><label>Decimal</label><code id="result-dec"></code></div>
                <div class="result-item"><label>Hexadecimal</label><code id="result-hex"></code></div>
            </div>
        </div>
    </main>
    <footer><p>&copy; 2026 DevTools Hub. All tools are free to use.</p></footer>
    <script>
        function setTheme(theme) { document.body.setAttribute('data-theme', theme); document.querySelectorAll('.theme-btn').forEach(btn => btn.classList.toggle('active', btn.getAttribute('data-theme') === theme)); localStorage.setItem('theme', theme); }
        setTheme(localStorage.getItem('theme') || 'light');

        function convert() {
            const input = document.getElementById('input-number').value.trim();
            const fromBase = parseInt(document.getElementById('from-base').value);
            if (!input) { alert('Please enter a number.'); return; }
            try {
                const decimal = parseInt(input, fromBase);
                if (isNaN(decimal)) throw new Error('Invalid number for selected base');
                document.getElementById('result-bin').textContent = decimal.toString(2);
                document.getElementById('result-oct').textContent = decimal.toString(8);
                document.getElementById('result-dec').textContent = decimal.toString(10);
                document.getElementById('result-hex').textContent = decimal.toString(16).toUpperCase();
                document.getElementById('result-card').style.display = 'block';
            } catch (e) {
                alert('Invalid number: ' + e.message);
            }
        }
    </script>
</body>
</html>
