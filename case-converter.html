<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Convert text case: uppercase, lowercase, title case, sentence case. Free online text case converter.">
    <meta name="keywords" content="case converter, text case, uppercase, lowercase, title case, sentence case">
    <title>Case Converter - DevTools Hub</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div class="header-content">
            <a href="index.html" class="logo"><div class="logo-icon">{ }</div><span class="logo-text">DevTools Hub</span></a>
            <div class="header-right">
                <nav class="nav-links"><a href="index.html">Tools</a><a href="index.html#about">About</a></nav>
                <div class="theme-switcher">
                    <button class="theme-btn" data-theme="light" title="Light" onclick="setTheme('light')">☀</button>
                    <button class="theme-btn" data-theme="dark" title="Dark" onclick="setTheme('dark')">🌙</button>
                    <button class="theme-btn" data-theme="sepia" title="Sepia" onclick="setTheme('sepia')">📜</button>
                    <button class="theme-btn" data-theme="contrast" title="High Contrast" onclick="setTheme('contrast')">◐</button>
                </div>
            </div>
        </div>
    </header>
    <main>
        <a href="index.html" class="back-link">← Back to all tools</a>
        <div class="tool-header"><h1>Case Converter</h1><p>Convert text between different cases</p></div>

        <div class="card">
            <div class="card-title">Input Text</div>
            <textarea id="input" placeholder="Enter text to convert..." style="height:150px;"></textarea>
        </div>

        <div class="card">
            <div class="card-title">Convert To</div>
            <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:0.5rem;margin-top:1rem;">
                <button class="btn btn-primary" onclick="convert('upper')">UPPERCASE</button>
                <button class="btn btn-primary" onclick="convert('lower')">lowercase</button>
                <button class="btn btn-primary" onclick="convert('title')">Title Case</button>
                <button class="btn btn-primary" onclick="convert('sentence')">Sentence case</button>
                <button class="btn btn-primary" onclick="convert('toggle')">tOGGLE cASE</button>
                <button class="btn btn-primary" onclick="convert('camel')">camelCase</button>
                <button class="btn btn-primary" onclick="convert('pascal')">PascalCase</button>
                <button class="btn btn-primary" onclick="convert('snake')">snake_case</button>
                <button class="btn btn-primary" onclick="convert('kebab')">kebab-case</button>
                <button class="btn btn-primary" onclick="convert('cobol')">COBOL-CASE</button>
            </div>
        </div>

        <div class="card" id="result-card" style="display:none;">
            <div class="card-title">Output</div>
            <textarea id="output" style="height:150px;" readonly></textarea>
            <div class="btn-group">
                <button class="btn btn-primary" onclick="copyOutput()">Copy</button>
            </div>
        </div>
    </main>
    <footer><p>&copy; 2026 DevTools Hub. All tools are free to use.</p></footer>
    <script>
        function setTheme(theme) { document.body.setAttribute('data-theme', theme); document.querySelectorAll('.theme-btn').forEach(btn => btn.classList.toggle('active', btn.getAttribute('data-theme') === theme)); localStorage.setItem('theme', theme); }
        setTheme(localStorage.getItem('theme') || 'light');

        function convert(type) {
            const input = document.getElementById('input').value;
            if (!input) { alert('Please enter text first.'); return; }
            let result = '';
            const words = input.split(/\s+/);
            switch(type) {
                case 'upper': result = input.toUpperCase(); break;
                case 'lower': result = input.toLowerCase(); break;
                case 'title': result = words.map(w => w.charAt(0).toUpperCase() + w.slice(1).toLowerCase()).join(' '); break;
                case 'sentence': result = input.toLowerCase().replace(/(^\s*|[.!?]\s+)([a-z])/g, (m, p, c) => p + c.toUpperCase()); break;
                case 'toggle': result = input.split('').map(c => c === c.toUpperCase() ? c.toLowerCase() : c.toUpperCase()).join(''); break;
                case 'camel': result = words.map((w, i) => i === 0 ? w.toLowerCase() : w.charAt(0).toUpperCase() + w.slice(1).toLowerCase()).join(''); break;
                case 'pascal': result = words.map(w => w.charAt(0).toUpperCase() + w.slice(1).toLowerCase()).join(''); break;
                case 'snake': result = words.map(w => w.toLowerCase()).join('_'); break;
                case 'kebab': result = words.map(w => w.toLowerCase()).join('-'); break;
                case 'cobol': result = words.map(w => w.toUpperCase()).join('-'); break;
            }
            document.getElementById('output').value = result;
            document.getElementById('result-card').style.display = 'block';
        }

        function copyOutput() { navigator.clipboard.writeText(document.getElementById('output').value).then(() => alert('Copied!')); }
    </script>
</body>
</html>
