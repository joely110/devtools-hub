<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Convert JSON to CSV and TSV format. Download as CSV file or copy to clipboard.">
    <meta name="keywords" content="json to csv, json to tsv, convert json, json csv converter">
    <title>JSON to CSV/TSV - DevTools Hub</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div class="header-content">
            <a href="index.html" class="logo"><div class="logo-icon">{ }</div><span class="logo-text">DevTools Hub</span></a>
            <div class="header-right">
                <nav class="nav-links"><a href="index.html">Tools</a><a href="index.html#about">About</a></nav>
                <div class="theme-switcher">
                    <button class="theme-btn" data-theme="light" title="Light" onclick="setTheme('light')">☀</button>
                    <button class="theme-btn" data-theme="dark" title="Dark" onclick="setTheme('dark')">🌙</button>
                    <button class="theme-btn" data-theme="sepia" title="Sepia" onclick="setTheme('sepia')">📜</button>
                    <button class="theme-btn" data-theme="contrast" title="High Contrast" onclick="setTheme('contrast')">◐</button>
                </div>
            </div>
        </div>
    </header>
    <main>
        <a href="index.html" class="back-link">← Back to all tools</a>
        <div class="tool-header"><h1>JSON to CSV/TSV</h1><p>Convert JSON arrays to CSV or TSV format</p></div>

        <div class="card">
            <div class="card-title">JSON Input (Array of Objects)</div>
            <textarea id="json-input" placeholder='[{"name": "John", "age": 30}, {"name": "Jane", "age": 25}]' style="height:200px;"></textarea>
            <div class="btn-group">
                <button class="btn btn-primary" onclick="toCSV()">Convert to CSV</button>
                <button class="btn btn-primary" onclick="toTSV()">Convert to TSV</button>
                <button class="btn btn-secondary" onclick="clearInput()">Clear</button>
            </div>
        </div>

        <div class="card" id="result-card" style="display:none;">
            <div class="card-title">Output <span id="format-label" style="font-weight:normal;"></span></div>
            <textarea id="output" style="height:200px;font-family:'SF Mono',Monaco,monospace;font-size:0.85rem;" readonly></textarea>
            <div class="btn-group">
                <button class="btn btn-primary" onclick="copyOutput()">Copy</button>
                <button class="btn btn-primary" onclick="downloadOutput()">Download</button>
            </div>
        </div>
    </main>
    <footer><p>&copy; 2026 DevTools Hub. All tools are free to use.</p></footer>
    <script>
        function setTheme(theme) { document.body.setAttribute('data-theme', theme); document.querySelectorAll('.theme-btn').forEach(btn => btn.classList.toggle('active', btn.getAttribute('data-theme') === theme)); localStorage.setItem('theme', theme); }
        setTheme(localStorage.getItem('theme') || 'light');

        function getHeaders(data) {
            const headers = new Set();
            data.forEach(item => {
                if (typeof item === 'object' && !Array.isArray(item)) {
                    Object.keys(item).forEach(k => headers.add(k));
                }
            });
            return Array.from(headers);
        }

        function convert(format) {
            const input = document.getElementById('json-input').value;
            if (!input.trim()) { alert('Please enter JSON first.'); return; }
            try {
                const data = JSON.parse(input);
                if (!Array.isArray(data)) { alert('JSON must be an array of objects.'); return; }

                const delimiter = format === 'csv' ? ',' : '\t';
                const headers = getHeaders(data);
                const lines = [headers.map(h => `"${h}"`).join(delimiter)];

                data.forEach(item => {
                    if (typeof item === 'object' && !Array.isArray(item)) {
                        const row = headers.map(h => {
                            const val = item[h];
                            if (val === undefined || val === null) return '';
                            if (typeof val === 'string') return `"${val.replace(/"/g, '""')}"`;
                            return String(val);
                        });
                        lines.push(row.join(delimiter));
                    }
                });

                document.getElementById('output').value = lines.join('\n');
                document.getElementById('format-label').textContent = '(' + format.toUpperCase() + ')';
                document.getElementById('result-card').style.display = 'block';
                window.currentFormat = format;
            } catch (e) {
                alert('Invalid JSON: ' + e.message);
            }
        }

        function toCSV() { convert('csv'); }
        function toTSV() { convert('tsv'); }

        function clearInput() { document.getElementById('json-input').value = ''; document.getElementById('output').value = ''; document.getElementById('result-card').style.display = 'none'; }
        function copyOutput() { navigator.clipboard.writeText(document.getElementById('output').value).then(() => alert('Copied!')); }
        function downloadOutput() {
            const content = document.getElementById('output').value;
            const ext = window.currentFormat === 'csv' ? 'csv' : 'tsv';
            const blob = new Blob([content], { type: 'text/' + ext });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'data.' + ext;
            a.click();
            URL.revokeObjectURL(url);
        }
    </script>
</body>
</html>
