<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Free online URL encoder and decoder. Safely encode or decode URL strings. No signup required, works entirely in your browser.">
    <meta name="keywords" content="URL encoder, URL decoder, encode URL, decode URL, online URL encoder">
    <title>URL Encoder/Decoder - Free Online Tool</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .tool-container {
            background: #fff;
            border-radius: 8px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        textarea {
            width: 100%;
            height: 150px;
            padding: 1rem;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-family: monospace;
            font-size: 14px;
            resize: vertical;
        }
        textarea:focus {
            outline: none;
            border-color: #4a90d9;
        }
        .result-box {
            margin-top: 1rem;
            padding: 1rem;
            background: #f7fafc;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            font-family: monospace;
            white-space: pre-wrap;
            word-break: break-all;
            max-height: 300px;
            overflow-y: auto;
        }
        .nav-links { margin-bottom: 1.5rem; }
        .nav-links a { color: #4a90d9; text-decoration: none; }
        .nav-links a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <header>
        <h1>URL Encoder/Decoder</h1>
        <p>Safely Encode or Decode URL Strings</p>
    </header>

    <main>
        <div class="nav-links">
            <a href="index.html">&larr; Back to DevTools Hub</a>
        </div>

        <div class="tool-container">
            <label><strong>Enter URL:</strong></label>
            <textarea id="url-input" placeholder="Enter URL to encode or decode..."></textarea>
            <div style="margin-top: 1rem;">
                <button class="btn btn-primary" onclick="encodeURL()">Encode</button>
                <button class="btn btn-secondary" onclick="decodeURL()">Decode</button>
                <button class="btn btn-secondary" onclick="clearURL()">Clear</button>
            </div>
        </div>

        <div class="tool-container">
            <label><strong>Result:</strong></label>
            <div id="result" class="result-box">Enter a URL and click Encode or Decode to see the result.</div>
            <div style="margin-top: 1rem;">
                <button class="btn btn-primary" id="copy-btn" style="display:none;" onclick="copyResult()">Copy Result</button>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 DevTools Hub. All tools are free to use.</p>
    </footer>

    <script>
        function encodeURL() {
            const input = document.getElementById('url-input').value;
            const result = document.getElementById('result');
            const copyBtn = document.getElementById('copy-btn');

            if (!input) {
                result.textContent = 'Please enter a URL first.';
                return;
            }

            try {
                const encoded = encodeURIComponent(input);
                result.textContent = encoded;
                copyBtn.style.display = 'inline-block';
            } catch (e) {
                result.textContent = 'Error: ' + e.message;
            }
        }

        function decodeURL() {
            const input = document.getElementById('url-input').value;
            const result = document.getElementById('result');
            const copyBtn = document.getElementById('copy-btn');

            if (!input) {
                result.textContent = 'Please enter a URL first.';
                return;
            }

            try {
                const decoded = decodeURIComponent(input);
                result.textContent = decoded;
                copyBtn.style.display = 'inline-block';
            } catch (e) {
                result.textContent = 'Error: Invalid encoded URL - ' + e.message;
            }
        }

        function clearURL() {
            document.getElementById('url-input').value = '';
            document.getElementById('result').textContent = 'Enter a URL and click Encode or Decode to see the result.';
            document.getElementById('copy-btn').style.display = 'none';
        }

        function copyResult() {
            const result = document.getElementById('result').textContent;
            navigator.clipboard.writeText(result).then(() => {
                alert('Copied to clipboard!');
            });
        }
    </script>
</body>
</html>
