<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Beautify and minify JavaScript code. Format JS with proper indentation. Free JS beautifier tool.">
    <meta name="keywords" content="javascript beautifier, js formatter, format javascript, beautify js, js prettifier">
    <title>JavaScript Beautifier - DevTools Hub</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div class="header-content">
            <a href="index.html" class="logo"><div class="logo-icon">{ }</div><span class="logo-text">DevTools Hub</span></a>
            <div class="header-right">
                <nav class="nav-links"><a href="index.html">Tools</a><a href="index.html#about">About</a></nav>
                <div class="theme-switcher">
                    <button class="theme-btn" data-theme="light" title="Light" onclick="setTheme('light')">☀</button>
                    <button class="theme-btn" data-theme="dark" title="Dark" onclick="setTheme('dark')">🌙</button>
                    <button class="theme-btn" data-theme="sepia" title="Sepia" onclick="setTheme('sepia')">📜</button>
                    <button class="theme-btn" data-theme="contrast" title="High Contrast" onclick="setTheme('contrast')">◐</button>
                </div>
            </div>
        </div>
    </header>
    <main>
        <a href="index.html" class="back-link">← Back to all tools</a>
        <div class="tool-header"><h1>JavaScript Beautifier</h1><p>Format and beautify JavaScript code</p></div>

        <div class="card">
            <div class="card-title">JavaScript Code</div>
            <textarea id="input" placeholder="const fn=function(){console.log('Hello');};" style="height:200px;"></textarea>
            <div class="btn-group">
                <button class="btn btn-primary" onclick="beautify()">Beautify</button>
                <button class="btn btn-secondary" onclick="minify()">Minify</button>
                <button class="btn btn-secondary" onclick="clearInput()">Clear</button>
            </div>
        </div>

        <div class="card" id="result-card" style="display:none;">
            <div class="card-title">Output <span id="size-info" style="font-weight:normal;font-size:0.8rem;"></span></div>
            <textarea id="output" style="height:200px;font-family:'SF Mono',Monaco,monospace;" readonly></textarea>
            <div class="btn-group">
                <button class="btn btn-primary" onclick="copyOutput()">Copy</button>
            </div>
        </div>
    </main>
    <footer><p>&copy; 2026 DevTools Hub. All tools are free to use.</p></footer>
    <script>
        function setTheme(theme) { document.body.setAttribute('data-theme', theme); document.querySelectorAll('.theme-btn').forEach(btn => btn.classList.toggle('active', btn.getAttribute('data-theme') === theme)); localStorage.setItem('theme', theme); }
        setTheme(localStorage.getItem('theme') || 'light');

        function beautify() {
            const input = document.getElementById('input').value;
            if (!input.trim()) { alert('Please enter JavaScript code first.'); return; }
            try {
                // Simple beautifier
                let result = input
                    .replace(/\s*;\s*/g, ';\n')
                    .replace(/\s*{\s*/g, ' {\n')
                    .replace(/\s*}\s*/g, '\n}\n')
                    .replace(/\s*,\s*/g, ', ')
                    .replace(/\s*\(\s*/g, '(')
                    .replace(/\s*\)\s*/g, ')')
                    .replace(/\n\s*\n/g, '\n');

                // Indent
                let indent = 0;
                const lines = result.split('\n').map(line => {
                    const trimmed = line.trim();
                    if (trimmed.startsWith('}')) indent = Math.max(0, indent - 1);
                    const indented = '  '.repeat(Math.max(0, indent)) + trimmed;
                    if (trimmed.endsWith('{')) indent++;
                    return indented;
                });

                result = lines.join('\n').trim();
                document.getElementById('output').value = result;
                showResult(result, input);
            } catch (e) { alert('Error formatting code: ' + e.message); }
        }

        function minify() {
            const input = document.getElementById('input').value;
            if (!input.trim()) { alert('Please enter JavaScript code first.'); return; }
            try {
                let result = input
                    .replace(/\/\*[\s\S]*?\*\//g, '')
                    .replace(/\/\/.*/g, '')
                    .replace(/\s+/g, ' ')
                    .replace(/\s*([{}()[\];,+<>&|=])\s*/g, '$1')
                    .trim();
                document.getElementById('output').value = result;
                showResult(result, input);
            } catch (e) { alert('Error minifying code: ' + e.message); }
        }

        function showResult(result, original) {
            document.getElementById('result-card').style.display = 'block';
            const origSize = new Blob([original]).size;
            const newSize = new Blob([result]).size;
            const reduction = ((origSize - newSize) / origSize * 100).toFixed(1);
            document.getElementById('size-info').textContent = origSize !== newSize ? `Size: ${origSize} → ${newSize} (${reduction}% ${origSize > newSize ? 'smaller' : 'larger'})` : '';
        }

        function clearInput() { document.getElementById('input').value = ''; document.getElementById('output').value = ''; document.getElementById('result-card').style.display = 'none'; }
        function copyOutput() { navigator.clipboard.writeText(document.getElementById('output').value).then(() => alert('Copied!')); }
    </script>
</body>
</html>
